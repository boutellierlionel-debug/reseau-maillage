<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Maillage — réseau de formation IA</title>
<meta name="description" content="Démo : l'espace d'un réseau de formation à l'IA. Un seul fil, une seule salle, et ce qui attend une réponse en premier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --papier:#F4F2ED;
    --blanc:#FFFFFF;
    --voile:#EAE7E0;
    --trait:#DDD9D0;
    --trait-fort:#C7C2B6;
    --encre:#1B2A33;
    --encre-2:#586870;
    --encre-3:#8A928C;
    --canard:#0E6470;
    --canard-clair:#DCEDEF;
    --cuivre:#B5603A;
    --cuivre-clair:#F6E7DF;
    --pousse:#3E7A55;
    --pousse-clair:#E0EDE4;
    --sur-canard:#FFFFFF;
    --ombre:0 1px 2px rgba(27,42,51,.05), 0 12px 28px -22px rgba(27,42,51,.55);
    --titre:'Newsreader', Georgia, 'Times New Roman', serif;
    --texte:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --papier:#12181C; --blanc:#192126; --voile:#212B31; --trait:#28343A; --trait-fort:#3A484F;
      --encre:#E9EEEC; --encre-2:#A3B0B3; --encre-3:#77868A;
      --canard:#5FC3CE; --canard-clair:#12333A; --cuivre:#E0906A; --cuivre-clair:#33211A;
      --pousse:#74B98D; --pousse-clair:#182E22; --sur-canard:#0B1518;
      --ombre:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -22px rgba(0,0,0,.95);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --papier:#12181C; --blanc:#192126; --voile:#212B31; --trait:#28343A; --trait-fort:#3A484F;
    --encre:#E9EEEC; --encre-2:#A3B0B3; --encre-3:#77868A;
    --canard:#5FC3CE; --canard-clair:#12333A; --cuivre:#E0906A; --cuivre-clair:#33211A;
    --pousse:#74B98D; --pousse-clair:#182E22; --sur-canard:#0B1518;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -22px rgba(0,0,0,.95);
  }

  *{box-sizing:border-box;}
  html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{margin:0; background:var(--papier); color:var(--encre); font-family:var(--texte); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  h1,h2,h3{margin:0; font-family:var(--titre); font-weight:500; line-height:1.18; letter-spacing:-.01em; text-wrap:balance;}
  p{margin:0;}
  button{font:inherit; font-family:var(--texte); color:inherit; cursor:pointer;}
  a{color:var(--canard);}
  :focus-visible{outline:2px solid var(--canard); outline-offset:3px; border-radius:3px;}

  .enveloppe{max-width:760px; margin:0 auto; padding-inline:20px;}
  @media (max-width:430px){ .enveloppe{padding-inline:16px;} }

  /* ---------- en-tête ---------- */
  .top{border-bottom:1px solid var(--trait); background:var(--papier);}
  .top-in{display:flex; align-items:center; gap:14px; padding-block:14px;}
  .marque{font-family:var(--titre); font-size:21px; font-weight:600; letter-spacing:-.015em; margin-right:auto;}
  .marque span{color:var(--canard);}
  .jour{font-size:13px; color:var(--encre-3);}
  @media (max-width:520px){ .jour{display:none;} }

  /* ---------- onglets ---------- */
  .onglets{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--papier); border-bottom:1px solid var(--trait);}
  .onglets-in{display:flex; overflow-x:auto;}
  .onglets button{
    background:none; border:0; padding:13px 2px; margin-right:24px; white-space:nowrap;
    font-size:15px; font-weight:600; color:var(--encre-3);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .onglets button:last-child{margin-right:0;}
  .onglets button[aria-selected="true"]{color:var(--encre); border-bottom-color:var(--canard);}
  .onglets .compte{
    display:inline-block; margin-left:6px; min-width:19px; padding:0 6px; border-radius:999px;
    background:var(--cuivre-clair); color:var(--cuivre); font-size:12px; font-weight:700; line-height:19px; text-align:center;
  }

  /* ---------- pages ---------- */
  main{padding-block:26px 130px;}
  .chapeau{margin-bottom:28px;}
  .sur-titre{font-size:12.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--encre-3); margin-bottom:7px;}
  h1{font-size:31px;}
  @media (max-width:430px){ h1{font-size:26px;} }
  .chapeau p{color:var(--encre-2); margin-top:10px; max-width:58ch;}

  section + section{margin-top:36px;}
  .titre-section{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--trait);}
  .titre-section h2{font-size:19px;}
  .titre-section .note{font-size:13px; color:var(--encre-3); margin-left:auto; white-space:nowrap;}

  /* ---------- boutons ---------- */
  .b{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--canard); color:var(--sur-canard); border:1px solid var(--canard);
    padding:9px 17px; border-radius:9px; font-size:15px; font-weight:600; text-decoration:none;
  }
  .b:hover{filter:brightness(1.08);}
  .b:disabled{opacity:.45; cursor:not-allowed;}
  .b.creux{background:transparent; color:var(--encre); border-color:var(--trait-fort);}
  .b.creux:hover{border-color:var(--encre-2); filter:none;}
  .b.chaud{background:var(--cuivre); border-color:var(--cuivre); color:#fff;}
  .b.petit{padding:6px 12px; font-size:14px; border-radius:8px;}
  .b svg{flex:none;}
  .lien{background:none; border:0; padding:4px 0; font-size:14px; font-weight:600; color:var(--canard); text-decoration:underline; text-underline-offset:3px;}
  .lien:hover{color:var(--encre);}

  /* ---------- la salle ---------- */
  .salle{
    display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
    background:var(--blanc); border:1px solid var(--trait); border-radius:14px; padding:16px 18px; box-shadow:var(--ombre);
  }
  .salle.active{background:var(--cuivre-clair); border-color:color-mix(in srgb, var(--cuivre) 35%, transparent);}
  @media (max-width:560px){ .salle{grid-template-columns:auto 1fr; gap:12px;} .salle .b{grid-column:1 / -1; width:100%;} }
  .salle .qui{font-size:15.5px; line-height:1.4; font-weight:700;}
  .salle .sous{font-size:13.5px; color:var(--encre-2); margin-top:3px;}
  .onde{display:flex; align-items:flex-end; gap:3px; height:26px;}
  .onde i{width:3px; border-radius:2px; background:var(--cuivre); height:6px;}
  .onde.vit i{animation:onde 1.1s ease-in-out infinite;}
  .onde i:nth-child(2){animation-delay:.14s} .onde i:nth-child(3){animation-delay:.28s}
  .onde i:nth-child(4){animation-delay:.42s} .onde i:nth-child(5){animation-delay:.56s}
  @keyframes onde{0%,100%{height:6px}50%{height:24px}}
  .onde.dort i{background:var(--encre-3); opacity:.45;}

  /* ---------- attentes ---------- */
  .attente{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; padding:15px 0; border-bottom:1px solid var(--trait);}
  .attente:last-child{border-bottom:0;}
  @media (max-width:560px){ .attente{grid-template-columns:auto 1fr;} .attente .b{grid-column:2; justify-self:start;} }
  .attente .q{font-size:15.5px; line-height:1.45;}
  .attente .meta{font-size:13px; color:var(--encre-3); margin-top:4px;}
  .age{color:var(--cuivre); font-weight:600;}

  /* ---------- écrire ---------- */
  .ecrire{background:var(--blanc); border:1px solid var(--trait); border-radius:14px; padding:14px 16px; box-shadow:var(--ombre);}
  .ecrire .choix{display:flex; gap:7px; margin-bottom:11px; flex-wrap:wrap;}
  .ecrire textarea{width:100%; min-height:58px; resize:vertical; border:0; background:transparent; font:inherit; color:inherit; outline:none; line-height:1.55;}
  .ecrire textarea::placeholder{color:var(--encre-3);}
  .ecrire .bas{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; margin-top:10px; padding-top:11px; border-top:1px solid var(--trait);}
  .conseil{font-size:13px; color:var(--encre-3); max-width:44ch;}

  /* ---------- filtres ---------- */
  .filtres{display:flex; gap:7px; flex-wrap:wrap; margin:24px 0 2px;}
  .puce{
    background:var(--blanc); border:1px solid var(--trait); color:var(--encre-2);
    padding:5px 13px; border-radius:999px; font-size:14px; font-weight:500;
  }
  .puce[aria-pressed="true"]{background:var(--encre); border-color:var(--encre); color:var(--papier);}
  .puce .n{font-variant-numeric:tabular-nums; opacity:.6; margin-left:5px;}

  /* ---------- fil ---------- */
  .mot{padding:22px 0; border-bottom:1px solid var(--trait);}
  .mot .tete{display:flex; align-items:center; gap:11px; margin-bottom:11px;}
  .mot .nom{font-weight:700; font-size:15px; line-height:1.3;}
  .mot .ident{font-size:13px; color:var(--encre-3); line-height:1.35;}
  .mot .quand{margin-left:auto; font-size:12.5px; color:var(--encre-3); white-space:nowrap; text-align:right;}
  .etiq{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:6px;}
  .etiq.q{background:var(--cuivre-clair); color:var(--cuivre);}
  .etiq.ok{background:var(--pousse-clair); color:var(--pousse);}
  .etiq.part{background:var(--canard-clair); color:var(--canard);}
  .mot .corps{font-size:16.5px; line-height:1.6; max-width:62ch;}
  .mot .corps.serif{font-family:var(--titre); font-size:20px; line-height:1.48;}
  .mot .actions{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:13px;}
  .reponses{margin-top:16px; display:grid; gap:15px; border-left:2px solid var(--trait); padding-left:16px;}
  .rep{display:grid; grid-template-columns:auto 1fr; gap:11px;}
  .rep .nom{font-weight:600; font-size:14.5px;}
  .rep .quand{font-size:12.5px; color:var(--encre-3);}
  .rep .corps{font-size:15.5px; margin-top:2px; line-height:1.55;}
  .rep.retenue{background:var(--pousse-clair); border-radius:10px; padding:13px 15px; margin-left:-15px;}
  .retenue-flag{font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--pousse); display:block; margin-bottom:4px;}
  .repondre{margin-top:15px; display:grid; gap:9px;}
  .repondre textarea{width:100%; min-height:66px; border:1px solid var(--trait); border-radius:10px; background:var(--blanc); font:inherit; color:inherit; padding:11px 13px; outline:none; resize:vertical;}
  .repondre textarea:focus{border-color:var(--canard);}
  .repondre .bas{display:flex; gap:12px; align-items:center;}

  /* ---------- pastille ---------- */
  .past{
    width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center;
    font-size:13px; font-weight:700; background:var(--voile); color:var(--encre-2);
  }
  .past.pt{width:28px; height:28px; font-size:11px;}
  .past.c{background:var(--canard-clair); color:var(--canard);}
  .past.m{background:var(--cuivre-clair); color:var(--cuivre);}
  .past.a{background:var(--pousse-clair); color:var(--pousse);}

  /* ---------- ressources ---------- */
  .cherche{display:flex; align-items:center; gap:10px; background:var(--blanc); border:1px solid var(--trait); border-radius:11px; padding:10px 14px; margin-bottom:8px;}
  .cherche input{border:0; background:transparent; font:inherit; color:inherit; width:100%; outline:none; min-width:0;}
  .res{display:grid; grid-template-columns:auto 1fr auto; gap:15px; align-items:center; padding:17px 0; border-bottom:1px solid var(--trait);}
  @media (max-width:560px){ .res{grid-template-columns:auto 1fr;} .res .b{grid-column:2; justify-self:start;} }
  .res .type{
    width:46px; height:46px; border-radius:11px; display:grid; place-items:center;
    background:var(--voile); color:var(--encre-2); font-size:11px; font-weight:700; text-transform:uppercase;
  }
  .res h3{font-family:var(--texte); font-size:16px; font-weight:700; line-height:1.35;}
  .res .par{font-size:13.5px; color:var(--encre-2); margin-top:3px;}
  .res .sert{font-size:13px; color:var(--encre-3); margin-top:3px;}

  /* ---------- dates ---------- */
  .date-l{display:grid; grid-template-columns:76px 1fr auto; gap:18px; align-items:center; padding:18px 0; border-bottom:1px solid var(--trait);}
  @media (max-width:560px){ .date-l{grid-template-columns:58px 1fr;} .date-l .cta{grid-column:2; justify-self:start; display:flex; gap:8px; flex-wrap:wrap;} }
  .date-l .cal{text-align:center;}
  .date-l .cal .j{font-family:var(--titre); font-size:30px; font-weight:600; line-height:1;}
  .date-l .cal .m{font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--encre-3); margin-top:2px;}
  .date-l h3{font-family:var(--texte); font-size:16.5px; font-weight:700;}
  .date-l .ou{font-size:13.5px; color:var(--encre-2); margin-top:3px;}
  .date-l .places{font-size:13px; color:var(--encre-3); margin-top:5px;}
  .jauge{height:3px; background:var(--voile); border-radius:2px; max-width:180px; margin-top:7px; overflow:hidden;}
  .jauge i{display:block; height:100%; background:var(--canard);}
  .jauge i.plein{background:var(--cuivre);}
  .dans{font-size:13px; font-weight:600; color:var(--canard);}

  /* ---------- barre flottante ---------- */
  .dock{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(700px, calc(100% - 32px)); z-index:40;
    background:var(--encre); color:var(--papier);
    border-radius:15px; padding:11px 13px;
    display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center;
    box-shadow:0 10px 34px -12px rgba(0,0,0,.5);
  }
  .dock .titre{font-size:14.5px; font-weight:700; line-height:1.25;}
  .dock .sous{font-size:12.5px; opacity:.72; line-height:1.3;}
  .dock .outils{display:flex; gap:7px;}
  .dock .o{
    width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08); color:var(--papier); display:grid; place-items:center; padding:0;
  }
  .dock .o:hover{background:rgba(255,255,255,.16);}
  .dock .o[aria-pressed="true"]{background:var(--cuivre); border-color:var(--cuivre); color:#fff;}
  .dock .o.sortir{background:transparent;}
  .vu{display:flex; align-items:flex-end; gap:2.5px; height:22px; width:36px;}
  .vu i{width:3px; background:var(--pousse); border-radius:2px; height:3px; transition:height .08s linear;}
  .vu.coupe i{background:var(--cuivre);}
  @media (max-width:560px){
    .dock{grid-template-columns:1fr auto; gap:10px; padding:10px 12px;}
    .dock .vu{display:none;}
    .dock .o{width:38px; height:38px;}
  }

  .ecran{margin-top:16px; border-radius:13px; overflow:hidden; background:#000; border:1px solid var(--trait); position:relative;}
  .ecran video{display:block; width:100%; max-height:44vh; background:#000;}
  .ecran .lg{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.66); color:#fff; font-size:12px; padding:3px 9px; border-radius:6px;}

  .vide{padding:34px 22px; text-align:center; border:1px dashed var(--trait-fort); border-radius:13px; color:var(--encre-2);}
  .vide h3{font-size:18px; margin-bottom:6px; color:var(--encre);}
  .vide p{max-width:44ch; margin:0 auto 14px; font-size:15px;}

  .pied{border-top:1px solid var(--trait); margin-top:42px; padding-top:18px; font-size:13px; color:var(--encre-3); max-width:60ch;}
  .pied b{color:var(--cuivre); font-weight:700;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<header class="top">
  <div class="enveloppe top-in">
    <span class="marque">Le M<span>ai</span>llage</span>
    <span class="jour" id="jour"></span>
    <span class="past c" title="Lionel Boutellier">LB</span>
  </div>
</header>

<nav class="onglets">
  <div class="enveloppe onglets-in" id="onglets" role="tablist"></div>
</nav>

<main class="enveloppe" id="vue"></main>

<div id="dock"></div>

<script>
(function(){
"use strict";

/* ===================================================== données (fictives) */
var MOI = 'lb';

var GENS = [
  {id:'lb', nom:'Lionel Boutellier', ini:'LB', metier:'Animation du réseau', region:'Auvergne-Rhône-Alpes', voie:'anim'},
  {id:'mv', nom:'Marc Vaillant', ini:'MV', metier:'Kinésithérapeute du sport', region:'Auvergne-Rhône-Alpes', voie:'metier'},
  {id:'ap', nom:'Anne-Laure Pichon', ini:'AP', metier:'Expertise-comptable', region:'Auvergne-Rhône-Alpes', voie:'conseil'},
  {id:'fl', nom:'Farida Lemoine', ini:'FL', metier:'Maraîchère', region:'Auvergne-Rhône-Alpes', voie:'metier'},
  {id:'nb', nom:'Nadia Belkacem', ini:'NB', metier:'Formatrice en CCI', region:'Occitanie', voie:'conseil'},
  {id:'tr', nom:'Thomas Ruiz', ini:'TR', metier:'Atelier de menuiserie', region:'Occitanie', voie:'metier'},
  {id:'hb', nom:'Hugo Brenier', ini:'HB', metier:'Agence de communication', region:'Occitanie', voie:'conseil'},
  {id:'sk', nom:'Salomé Kerbrat', ini:'SK', metier:'Consultante indépendante', region:'Bretagne', voie:'conseil'},
  {id:'jm', nom:'Jules Marceau', ini:'JM', metier:'Club sportif', region:'Bretagne', voie:'metier'},
  {id:'cs', nom:'Camille Sorin', ini:'CS', metier:'Juriste', region:'Bretagne', voie:'conseil'},
  {id:'ef', nom:'Élodie Fauré', ini:'EF', metier:'Conseil RH', region:'Île-de-France', voie:'conseil'},
  {id:'pd', nom:'Pierre Dagnaud', ini:'PD', metier:'Logistique', region:'Île-de-France', voie:'metier'},
  {id:'ks', nom:'Karim Sellami', ini:'KS', metier:'Agence immobilière', region:'Hauts-de-France', voie:'metier'},
  {id:'vo', nom:'Véronique Ott', ini:'VO', metier:'Développement économique', region:'Hauts-de-France', voie:'conseil'}
];
var G = {}; GENS.forEach(function(p){ G[p.id] = p; });

var FIL = [
  {id:'f1', qui:'fl', type:'question', h:5,
   txt:"Je n'arrive pas à obtenir une fiche de traçabilité qui garde les mêmes colonnes d'une semaine sur l'autre. Il en invente une nouvelle à chaque fois, et je passe plus de temps à corriger qu'à saisir. Quelqu'un a trouvé la parade ?",
   rep:[]},
  {id:'f2', qui:'hb', type:'question', h:27,
   txt:"Quel ordre de grandeur pour une demi-journée de sensibilisation en collectivité ? Je suis à 750 € et j'ai l'impression d'être en dessous de tout le monde.",
   rep:[]},
  {id:'f3', qui:'mv', type:'partage', h:3,
   txt:"Test terminé : 11 comptes rendus de séance rédigés en 22 minutes, contre 2 h 10 avant. Le point qui coince, ce sont les noms des patients — je les remplace par un code avant, rien d'identifiant ne sort du cabinet.",
   rep:[{qui:'ap', h:2, txt:"Le coup du code, je le reprends pour mes dossiers clients. Simple, et ça règle la question."}]},
  {id:'f4', qui:'tr', type:'question', h:51, retenue:0,
   txt:"Comment vous facturez la mise en place quand le client n'a aucun fichier exploitable ? Chez mon dernier, j'ai passé deux jours à remettre au propre un export avant de pouvoir commencer.",
   rep:[{qui:'ap', h:49, txt:"Une ligne séparée « remise en état des données », au forfait, annoncée avant de démarrer. Sinon ça mange toute la marge, à chaque fois."},
        {qui:'nb', h:48, txt:"Et fais-la chiffrer par le client : quand il voit le prix, il retrouve souvent un export propre au fond d'un tiroir."}]},
  {id:'f5', qui:'ef', type:'partage', h:9,
   txt:"Sur 6 fiches de poste relues cette semaine, 4 reprenaient des critères discriminants présents dans les modèles du client. Le texte sort propre, bien tourné, et le problème est dedans. On relit ligne à ligne, toujours.",
   rep:[{qui:'cs', h:8, txt:"Juridiquement c'est l'employeur qui répond, pas l'outil ni le prestataire. À dire au client dès le cadrage."}]},
  {id:'f6', qui:'sk', type:'partage', h:30,
   txt:"J'ai perdu un appel d'offres faute d'une mention sur l'hébergement et la conservation des données. La clause que j'utilise depuis est dans les ressources, relue par Camille. Trois lignes, et ça débloque les dossiers publics.",

  {id:'f7', qui:'jm', type:'question', h:75, retenue:1,

var DANS_LA_SALLE = ['mv','fl','nb'];

/* ===================================================== état */
var ET = {
  vue:'aujourdhui', filtre:'tout', cherche:'', type:'question',
  brouillon:'', repond:null, deplie:{}, utiles:{}, inscrit:{}, nouveaux:[]
};
var VOIX = {dedans:false, flux:null, ctx:null, analyseur:null, tampon:null, raf:0,
            coupe:false, micro:'aucun', niveau:0, ecran:null, ptt:false, pttTemp:false};

function ech(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function past(id, taille){
  var p = G[id];
  var v = p.voie === 'conseil' ? 'c' : (p.voie === 'metier' ? 'm' : 'a');
  return '<span class="past ' + v + (taille ? ' ' + taille : '') + '" title="' + ech(p.nom) + '">' + ech(p.ini) + '</span>';
}
function depuis(h){
  if(h < 1) return "à l'instant";
  if(h < 24) return 'il y a ' + Math.round(h) + ' h';
  var j = Math.round(h / 24);
  return j === 1 ? 'hier' : 'il y a ' + j + ' jours';
}
function joursAvant(iso){
  var a = new Date(); a.setHours(0,0,0,0);
  return Math.round((new Date(iso + 'T00:00:00') - a) / 86400000);
}
function moisCourt(iso){
  return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', {month:'short'}).replace('.','');
}
function dansCombien(j){
  return j < 0 ? 'passée' : (j === 0 ? "aujourd'hui" : (j === 1 ? 'demain' : 'dans ' + j + ' jours'));
}
function tousLesMots(){ return ET.nouveaux.concat(FIL); }
function sansReponse(){
  return tousLesMots().filter(function(m){ return m.type === 'question' && !(m.rep && m.rep.length); });
}
function nbDansLaSalle(){ return DANS_LA_SALLE.length + (VOIX.dedans ? 1 : 0); }

/* ===================================================== onglets */
var VUES = [
  {id:'aujourdhui', nom:"Aujourd'hui"},
  {id:'echanges', nom:'Échanges'},
  {id:'ressources', nom:'Ressources'},
  {id:'dates', nom:'Dates'}
];
function rendreOnglets(){
  var n = sansReponse().length;
  document.getElementById('onglets').innerHTML = VUES.map(function(v){
    var badge = (v.id === 'echanges' && n) ? '<span class="compte">' + n + '</span>' : '';
    return '<button role="tab" data-vue="' + v.id + '" aria-selected="' + (ET.vue === v.id) + '">' + v.nom + badge + '</button>';
  }).join('');
}

/* ===================================================== aujourd'hui */
function vueAujourdhui(){
  var attentes = sansReponse().sort(function(a,b){ return b.h - a.h; });
  var prochaine = DATES.slice().sort(function(a,b){ return joursAvant(a.iso) - joursAvant(b.iso); })[0];
  var j = joursAvant(prochaine.iso);
  var dedans = nbDansLaSalle();

  var bouts = [];
  if(attentes.length) bouts.push(attentes.length + (attentes.length > 1 ? ' questions attendent' : ' question attend'));
  if(dedans) bouts.push(dedans + (dedans > 1 ? ' personnes sont dans la salle' : ' personne est dans la salle'));
  bouts.push('une session ' + dansCombien(j));
  var titre = bouts.join(', ');
  titre = titre.charAt(0).toUpperCase() + titre.slice(1);

  var h = '<div class="chapeau"><div class="sur-titre">Votre point du jour</div>'
    + '<h1>' + ech(titre) + '</h1>'
    + '<p>Tout se passe au même endroit : un fil pour les questions et les retours, une salle pour se parler. '
    + 'La région et le métier ne sont pas des portes à pousser, seulement des filtres.</p></div>';

  h += '<section><div class="titre-section"><h2>La salle</h2><span class="note">toujours ouverte</span></div>'
     + carteSalle() + '</section>';

  h += '<section><div class="titre-section"><h2>Sans réponse</h2><span class="note">'
     + (attentes.length ? 'la plus ancienne remonte à ' + depuis(attentes[0].h).replace('il y a ', '') : 'rien en attente')
     + '</span></div>';
  if(!attentes.length){
    h += '<div class="vide"><h3>Tout le monde a eu une réponse</h3>'
       + '<p>C’est rare. Profitez-en pour partager un retour, même court.</p>'
       + '<button class="b creux" data-aller="echanges">Aller au fil</button></div>';
  } else {
    h += attentes.slice(0, 3).map(function(m){
      return '<div class="attente">' + past(m.qui)
        + '<div><div class="q">' + ech(m.txt.slice(0, 112)) + (m.txt.length > 112 ? '…' : '') + '</div>'
        + '<div class="meta">' + ech(G[m.qui].nom) + ' · ' + ech(G[m.qui].metier)
        + ' · <span class="age">' + depuis(m.h) + '</span></div></div>'
        + '<button class="b petit" data-repondre="' + m.id + '">Répondre</button></div>';
    }).join('');
  }
  h += '</section>';

  h += '<section><div class="titre-section"><h2>Prochaine session</h2>'
     + '<span class="note dans">' + dansCombien(j) + '</span></div>'
     + ligneDate(prochaine) + '</section>';

  h += '<section><div class="titre-section"><h2>Ajouté cette semaine</h2><span class="note">par le réseau</span></div>'
     + RESSOURCES.slice(0, 2).map(ligneRessource).join('')
     + '<p style="margin-top:15px"><button class="lien" data-aller="ressources">Voir les '
     + RESSOURCES.length + ' ressources</button></p></section>';

  return h + pied();
}

function carteSalle(){
  var dedans = DANS_LA_SALLE.slice();
  if(VOIX.dedans) dedans.push(MOI);
  if(!dedans.length){
    return '<div class="salle"><span class="onde dort"><i></i><i></i><i></i><i></i><i></i></span>'
      + '<div><div class="qui">Personne pour l’instant</div>'
      + '<div class="sous">Entrez-y quand même : les autres verront que vous y êtes, et vous rejoindront.</div></div>'
      + '<button class="b" data-voix="entrer">Ouvrir la salle</button></div>';
  }
  var noms = dedans.map(function(id){ return id === MOI ? 'vous' : G[id].nom.split(' ')[0]; });
  var phrase = noms.length === 1 ? noms[0] + ' y est'
    : noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1] + ' y sont';
  return '<div class="salle active"><span class="onde vit"><i></i><i></i><i></i><i></i><i></i></span>'
    + '<div><div class="qui">' + ech(phrase) + '</div>'
    + '<div class="sous">' + dedans.map(function(id){ return ech(G[id].metier); }).join(' · ') + '</div></div>'
    + (VOIX.dedans ? '<button class="b creux" data-voix="sortir">Quitter</button>'
                   : '<button class="b chaud" data-voix="entrer">Rejoindre</button>') + '</div>';
}

/* ===================================================== échanges */
function vueEchanges(){
  var moi = G[MOI];
  var h = '<div class="chapeau"><div class="sur-titre">Le fil</div>'
    + '<h1>Une seule liste, pour tout le monde</h1>'
    + '<p>Pas de salon à choisir avant d’écrire. Vous posez votre question, elle arrive chez ceux que ça concerne, '
    + 'et elle reste visible tant qu’elle n’a pas de réponse.</p></div>';

  h += '<div class="ecrire"><div class="choix">'
    + '<button class="b petit' + (ET.type === 'question' ? '' : ' creux') + '" data-type="question">Poser une question</button>'
    + '<button class="b petit' + (ET.type === 'partage' ? '' : ' creux') + '" data-type="partage">Partager un retour</button></div>'
    + '<textarea id="brouillon" placeholder="' + (ET.type === 'question'
        ? 'Votre question, avec ce que vous avez déjà essayé…'
        : 'Ce que vous avez fait, ce que ça a donné, ce qui coince encore…') + '">' + ech(ET.brouillon) + '</textarea>'
    + '<div class="bas"><span class="conseil">' + (ET.type === 'question'
        ? 'Une question qui donne le contexte et le résultat attendu trouve réponse dans la journée.'
        : 'Un chiffre avant / après vaut mieux qu’un avis.') + '</span>'
    + '<button class="b" id="publier"' + (ET.brouillon.trim().length < 3 ? ' disabled' : '') + '>Publier</button></div></div>';

  var filtres = [
    {id:'tout', nom:'Tout', n:tousLesMots().length},
    {id:'region', nom:'Ma région', n:tousLesMots().filter(function(m){ return G[m.qui].region === moi.region; }).length},
    {id:'voie', nom:'Ma voie', n:tousLesMots().filter(function(m){ return G[m.qui].voie === moi.voie; }).length},
    {id:'attente', nom:'Sans réponse', n:sansReponse().length}
  ];
  h += '<div class="filtres">' + filtres.map(function(f){
    return '<button class="puce" data-filtre="' + f.id + '" aria-pressed="' + (ET.filtre === f.id) + '">'
      + f.nom + '<span class="n">' + f.n + '</span></button>';
  }).join('') + '</div>';

  var liste = tousLesMots().filter(function(m){
    if(ET.filtre === 'region') return G[m.qui].region === moi.region;
    if(ET.filtre === 'voie') return G[m.qui].voie === moi.voie;
    if(ET.filtre === 'attente') return m.type === 'question' && !(m.rep && m.rep.length);
    return true;
  }).sort(function(a, b){ return a.h - b.h; });

  h += liste.length ? liste.map(mot).join('')
    : '<div class="vide" style="margin-top:24px"><h3>Rien avec ce filtre</h3>'
      + '<p>Revenez à « Tout » pour voir l’ensemble du réseau.</p>'
      + '<button class="b creux" data-filtre="tout">Tout afficher</button></div>';

  return h + pied();
}

function mot(m){
  var p = G[m.qui];
  var rep = m.rep || [];
  var question = m.type === 'question';
  var resolue = question && rep.length;
  var ouvert = !!ET.deplie[m.id];
  var utile = !!ET.utiles[m.id];

  var etiq = question
    ? (resolue ? '<span class="etiq ok">Répondu</span>' : '<span class="etiq q">En attente</span>')
    : '<span class="etiq part">Retour</span>';

  var h = '<article class="mot"><div class="tete">' + past(m.qui)
    + '<div><div class="nom">' + ech(p.nom) + '</div>'
    + '<div class="ident">' + ech(p.metier) + ' · ' + ech(p.region) + '</div></div>'
    + '<span class="quand">' + etiq + '<br>' + depuis(m.h) + '</span></div>';

  h += '<p class="corps' + (question ? ' serif' : '') + '">' + ech(m.txt) + '</p>';

  h += '<div class="actions">'
    + '<button class="lien" data-repondre="' + m.id + '">Répondre</button>'
    + '<button class="lien" data-utile="' + m.id + '"' + (utile ? ' style="color:var(--pousse)"' : '') + '>'
    + (utile ? 'Noté comme utile' : 'Utile') + '</button>';

  var autres = rep.length - (typeof m.retenue === 'number' ? 1 : 0);
  if(autres > 0 && typeof m.retenue === 'number'){
    h += '<button class="lien" data-deplier="' + m.id + '">'
       + (ouvert ? 'Masquer' : autres + ' autre' + (autres > 1 ? 's' : '') + ' réponse' + (autres > 1 ? 's' : '')) + '</button>';
  }
  h += '</div>';

  var visibles = [];
  if(typeof m.retenue === 'number' && rep[m.retenue]) visibles.push({r:rep[m.retenue], retenue:true});
  if(typeof m.retenue !== 'number' || ouvert){
    rep.forEach(function(r, i){ if(i !== m.retenue) visibles.push({r:r, retenue:false}); });
  }
  if(visibles.length){
    h += '<div class="reponses">' + visibles.map(function(v){
      var a = G[v.r.qui];
      return '<div class="rep' + (v.retenue ? ' retenue' : '') + '">' + past(v.r.qui, 'pt')
        + '<div>' + (v.retenue ? '<span class="retenue-flag">La réponse qui a servi</span>' : '')
        + '<span class="nom">' + ech(a.nom) + '</span> <span class="quand">' + depuis(v.r.h) + '</span>'
        + '<p class="corps">' + ech(v.r.txt) + '</p></div></div>';
    }).join('') + '</div>';
  }

  if(ET.repond === m.id){
    h += '<div class="repondre"><textarea id="reponse" placeholder="Votre réponse à '
      + ech(p.nom.split(' ')[0]) + '…"></textarea>'
      + '<div class="bas"><button class="b petit" data-envoyer="' + m.id + '">Envoyer</button>'
      + '<button class="lien" data-annuler="1">Annuler</button></div></div>';
  }
  return h + '</article>';
}

/* ===================================================== ressources */
function vueRessources(){
  var q = ET.cherche.toLowerCase();
  var liste = RESSOURCES.filter(function(r){
    return !q || (r.t + ' ' + r.sert + ' ' + G[r.qui].nom + ' ' + r.type).toLowerCase().indexOf(q) > -1;
  });
  var h = '<div class="chapeau"><div class="sur-titre">Ce que le réseau fabrique</div>'
    + '<h1>Ressources</h1>'
    + '<p>Chaque fichier dit sur quel cas il a servi, et ce qu’il ne couvre pas. '
    + 'Sans ça on ne le réutilise pas : on le refait.</p></div>';
  h += '<div class="cherche">' + loupe()
    + '<input id="cherche" type="search" placeholder="Chercher : devis, données, tournée…" value="' + ech(ET.cherche) + '"></div>';
  h += liste.length ? liste.map(ligneRessource).join('')
    : '<div class="vide" style="margin-top:20px"><h3>Rien trouvé</h3>'
      + '<p>Essayez un mot du métier : devis, tarif, données, atelier, tournée.</p></div>';
  return h + pied();
}

function ligneRessource(r){
  return '<div class="res"><span class="type">' + ech(r.type) + '</span>'
    + '<div><h3>' + ech(r.t) + '</h3>'
    + '<div class="par">' + ech(G[r.qui].nom) + ' · ' + ech(G[r.qui].region) + '</div>'
    + '<div class="sert">' + ech(r.sert) + '</div></div>'
    + '<button class="b creux petit" data-prendre="1">Prendre · ' + r.n + '</button></div>';
}

/* ===================================================== dates */
function vueDates(){
  var liste = DATES.slice().sort(function(a, b){ return joursAvant(a.iso) - joursAvant(b.iso); });
  var h = '<div class="chapeau"><div class="sur-titre">Les rendez-vous</div>'
    + '<h1>Dates</h1>'
    + '<p>Les visios se tiennent dans la salle, la même que celle de l’accueil : '
    + 'rien d’autre à installer, aucun lien à retrouver.</p></div>';
  return h + liste.map(ligneDate).join('') + pied();
}

function ligneDate(d){
  var inscrit = !!ET.inscrit[d.id];
  var n = d.inscrits + (inscrit ? 1 : 0);
  var complet = n >= d.places;
  var j = joursAvant(d.iso);
  return '<div class="date-l"><div class="cal">'
    + '<div class="j">' + new Date(d.iso + 'T00:00:00').getDate() + '</div>'
    + '<div class="m">' + ech(moisCourt(d.iso)) + '</div></div>'
    + '<div><h3>' + ech(d.t) + '</h3>'
    + '<div class="ou">' + ech(d.h) + ' · ' + ech(d.ou) + '</div>'
    + '<div class="jauge"><i class="' + (complet ? 'plein' : '') + '" style="width:'
    + Math.min(100, Math.round(n / d.places * 100)) + '%"></i></div>'
    + '<div class="places">' + n + ' inscrits sur ' + d.places
    + (complet ? ' — complet, liste d’attente ouverte' : '') + '</div></div>'
    + '<div class="cta"><button class="b' + (inscrit ? ' creux' : '') + ' petit" data-inscrire="' + d.id + '" aria-pressed="' + inscrit + '">'
    + (inscrit ? 'Inscrit' : (complet ? "Liste d'attente" : 'Je viens')) + '</button>'
    + (d.visio && j <= 14 && j >= 0 ? '<button class="b creux petit" data-voix="entrer">Salle</button>' : '')
    + '</div></div>';
}

function pied(){
  return '<p class="pied"><b>Démo</b> — membres, messages, ressources et dates sont fictifs. '
    + 'Le micro de la salle, lui, fonctionne vraiment : il n’y a simplement personne au bout.</p>';
}
function loupe(){
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--encre-3);flex:none" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>';
}
function icone(n){
  var d = {
    micro:'<path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
    coupe:'<path d="M9 9v3a3 3 0 0 0 4.5 2.6"/><path d="M15 11V6a3 3 0 0 0-5.9-.7"/><path d="M5 11a7 7 0 0 0 10.9 5.8"/><path d="M12 18v3"/><path d="M4 4l16 16"/>',
    ecran:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>',
    sortir:'<path d="M6 6l12 12"/><path d="M18 6L6 18"/>'
  };
  return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d[n] + '</svg>';
}

/* ===================================================== barre flottante */
function rendreDock(){
  var dock = document.getElementById('dock');
  if(!VOIX.dedans){ dock.innerHTML = ''; return; }
  var etat = VOIX.micro === 'ok' ? (VOIX.coupe ? 'micro coupé' : 'micro ouvert')
           : (VOIX.micro === 'refuse' ? 'écoute seule, le navigateur a refusé le micro' : 'autorisation du micro…');
  var barres = '';
  for(var i = 0; i < 7; i++) barres += '<i></i>';
  dock.innerHTML = '<span class="vu' + (VOIX.coupe ? ' coupe' : '') + '" id="vu" aria-hidden="true">' + barres + '</span>'
    + '<div><div class="titre">La salle · ' + nbDansLaSalle() + ' personnes</div>'
    + '<div class="sous">' + ech(etat) + (VOIX.micro === 'ok' ? ' · barre d’espace pour parler' : '') + '</div></div>'
    + '<div class="outils">'
    + '<button class="o" data-voix="micro" aria-pressed="' + VOIX.coupe + '" aria-label="'
    + (VOIX.coupe ? 'Rouvrir le micro' : 'Couper le micro') + '">' + icone(VOIX.coupe ? 'coupe' : 'micro') + '</button>'
    + '<button class="o" data-voix="ecran" aria-pressed="' + (!!VOIX.ecran) + '" aria-label="Partager l’écran">' + icone('ecran') + '</button>'
    + '<button class="o sortir" data-voix="sortir" aria-label="Quitter la salle">' + icone('sortir') + '</button></div>';
}

function majVu(){
  var vu = document.getElementById('vu');
  if(!vu) return;
  var barres = vu.children, n = barres.length;
  for(var i = 0; i < n; i++){
    var centre = 1 - Math.abs(i - (n - 1) / 2) / n;
    var haut = 3 + (VOIX.niveau / 100) * 19 * (0.55 + centre);
    barres[i].style.height = Math.min(22, haut).toFixed(1) + 'px';
  }
}

/* ===================================================== audio */
function boucle(){
  if(!VOIX.analyseur) return;
  VOIX.analyseur.getByteTimeDomainData(VOIX.tampon);
  var somme = 0;
  for(var i = 0; i < VOIX.tampon.length; i++){ var v = (VOIX.tampon[i] - 128) / 128; somme += v * v; }
  VOIX.niveau = VOIX.coupe ? 0 : Math.min(100, Math.round(Math.sqrt(somme / VOIX.tampon.length) * 330));
  majVu();
  VOIX.raf = requestAnimationFrame(boucle);
}

function entrer(){
  if(VOIX.dedans) return;
  VOIX.dedans = true; VOIX.coupe = false; VOIX.micro = 'attente';
  rendre();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ VOIX.micro = 'refuse'; rendre(); return; }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}).then(function(flux){
    VOIX.flux = flux; VOIX.micro = 'ok';
    var AC = window.AudioContext || window.webkitAudioContext;
    VOIX.ctx = new AC();
    var src = VOIX.ctx.createMediaStreamSource(flux);
    VOIX.analyseur = VOIX.ctx.createAnalyser();
    VOIX.analyseur.fftSize = 512;
    VOIX.tampon = new Uint8Array(VOIX.analyseur.fftSize);
    src.connect(VOIX.analyseur);
    rendre();
    VOIX.raf = requestAnimationFrame(boucle);
  }).catch(function(){ VOIX.micro = 'refuse'; rendre(); });
}

function sortir(){
  if(VOIX.raf) cancelAnimationFrame(VOIX.raf);
  if(VOIX.flux) VOIX.flux.getTracks().forEach(function(t){ t.stop(); });
  if(VOIX.ecran) VOIX.ecran.getTracks().forEach(function(t){ t.stop(); });
  if(VOIX.ctx && VOIX.ctx.close){ try{ VOIX.ctx.close(); }catch(e){} }
  VOIX.raf = 0; VOIX.flux = null; VOIX.ecran = null; VOIX.ctx = null; VOIX.analyseur = null;
  VOIX.dedans = false; VOIX.coupe = false; VOIX.micro = 'aucun'; VOIX.niveau = 0;
  rendre();
}

function couper(force){
  VOIX.coupe = (typeof force === 'boolean') ? force : !VOIX.coupe;
  if(VOIX.flux) VOIX.flux.getAudioTracks().forEach(function(t){ t.enabled = !VOIX.coupe; });
  if(VOIX.coupe){ VOIX.niveau = 0; majVu(); }
  rendreDock();
  majVu();
}

function partager(){
  if(VOIX.ecran){
    VOIX.ecran.getTracks().forEach(function(t){ t.stop(); });
    VOIX.ecran = null; rendre(); return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
  navigator.mediaDevices.getDisplayMedia({video:true, audio:false}).then(function(flux){
    VOIX.ecran = flux;
    flux.getVideoTracks()[0].addEventListener('ended', function(){ VOIX.ecran = null; rendre(); });
    ET.vue = 'aujourdhui';
    rendre();
  }).catch(function(){});
}

/* ===================================================== rendu */
function rendre(){
  rendreOnglets();
  var v = document.getElementById('vue');
  if(ET.vue === 'aujourdhui') v.innerHTML = vueAujourdhui();
  else if(ET.vue === 'echanges') v.innerHTML = vueEchanges();
  else if(ET.vue === 'ressources') v.innerHTML = vueRessources();
  else v.innerHTML = vueDates();

  if(VOIX.ecran && ET.vue === 'aujourdhui'){
    var salle = v.querySelector('.salle');
    if(salle){
      var boite = document.createElement('div');
      boite.className = 'ecran';
      boite.innerHTML = '<span class="lg">Votre écran, en direct</span><video autoplay playsinline muted></video>';
      salle.parentNode.insertBefore(boite, salle.nextSibling);
      boite.querySelector('video').srcObject = VOIX.ecran;
    }
  }
  rendreDock();
  majVu();
  var r = document.getElementById('reponse');
  if(r) r.focus();
}

/* ===================================================== interactions */
document.addEventListener('click', function(e){
  if(e.target.id === 'publier'){
    var txt = ET.brouillon.trim();
    if(txt.length < 3) return;
    ET.nouveaux.unshift({id:'n' + Date.now(), qui:MOI, type:ET.type, h:0, txt:txt, rep:[]});
    ET.brouillon = '';
    rendre();
    return;
  }

  var el = e.target.closest('[data-vue],[data-aller],[data-filtre],[data-type],[data-repondre],[data-utile],[data-deplier],[data-envoyer],[data-annuler],[data-inscrire],[data-voix],[data-prendre]');
  if(!el) return;

  if(el.dataset.vue || el.dataset.aller){
    ET.vue = el.dataset.vue || el.dataset.aller;
    ET.repond = null;
    window.scrollTo({top:0, behavior:'smooth'});
    rendre(); return;
  }
  if(el.dataset.filtre){ ET.filtre = el.dataset.filtre; rendre(); return; }
  if(el.dataset.type){ ET.type = el.dataset.type; rendre(); return; }
  if(el.dataset.repondre){
    var venuDeAilleurs = ET.vue !== 'echanges';
    ET.vue = 'echanges';
    if(venuDeAilleurs) ET.filtre = 'tout';
    ET.repond = el.dataset.repondre;
    rendre();
    var champ = document.getElementById('reponse');
    if(champ) champ.closest('.mot').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(el.dataset.utile){
    var u = el.dataset.utile;
    if(ET.utiles[u]) delete ET.utiles[u]; else ET.utiles[u] = 1;
    rendre(); return;
  }
  if(el.dataset.deplier){
    var d = el.dataset.deplier;
    if(ET.deplie[d]) delete ET.deplie[d]; else ET.deplie[d] = 1;
    rendre(); return;
  }
  if(el.dataset.envoyer){
    var zone = document.getElementById('reponse');
    var rep = zone ? zone.value.trim() : '';
    if(rep.length < 2) return;
    var cible = tousLesMots().filter(function(m){ return m.id === el.dataset.envoyer; })[0];
    if(cible){ cible.rep = cible.rep || []; cible.rep.push({qui:MOI, h:0, txt:rep}); }
    ET.repond = null;
    rendre(); return;
  }
  if(el.dataset.annuler){ ET.repond = null; rendre(); return; }
  if(el.dataset.inscrire){
    var i = el.dataset.inscrire;
    if(ET.inscrit[i]) delete ET.inscrit[i]; else ET.inscrit[i] = 1;
    rendre(); return;
  }
  if(el.dataset.prendre){
    var t = el.textContent;
    el.textContent = 'Dans vos fichiers';
    setTimeout(function(){ el.textContent = t; }, 1700);
    return;
  }
  if(el.dataset.voix === 'entrer'){ entrer(); return; }
  if(el.dataset.voix === 'sortir'){ sortir(); return; }
  if(el.dataset.voix === 'micro'){ couper(); return; }
  if(el.dataset.voix === 'ecran'){ partager(); return; }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'brouillon'){
    ET.brouillon = e.target.value;
    var b = document.getElementById('publier');
    if(b) b.disabled = ET.brouillon.trim().length < 3;
  }
  if(e.target.id === 'cherche'){
    var pos = e.target.selectionStart;
    ET.cherche = e.target.value;
    rendre();
    var c = document.getElementById('cherche');
    if(c){ c.focus(); try{ c.setSelectionRange(pos, pos); }catch(err){} }
  }
});

document.addEventListener('keydown', function(e){
  var champ = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.code === 'Space' && !champ && VOIX.dedans && VOIX.micro === 'ok'){
    e.preventDefault();
    if(!VOIX.ptt){ VOIX.ptt = true; VOIX.pttTemp = VOIX.coupe; couper(!VOIX.coupe); }
  }
});
document.addEventListener('keyup', function(e){
  if(e.code === 'Space' && VOIX.ptt){ VOIX.ptt = false; couper(VOIX.pttTemp); }
});

document.getElementById('jour').textContent =
  new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
rendre();
})();
</script>
