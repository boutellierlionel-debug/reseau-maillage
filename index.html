<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Maillage — réseau de formation IA</title>
<meta name="description" content="Démo d'espace communautaire pour un réseau national de formation à l'IA : espaces par région, salons texte et salons vocaux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  :root{
    color-scheme: light;
    --ground:#F2F4EF;
    --surface:#FFFFFF;
    --surface-2:#E9ECE4;
    --surface-3:#E0E4D9;
    --ink:#16201C;
    --ink-2:#5A665F;
    --ink-3:#8B958E;
    --line:#DBE0D6;
    --line-2:#C9D0C3;
    --accent:#0E6E5B;
    --accent-ink:#0A5344;
    --accent-soft:#DDEBE4;
    --warm:#A9511D;
    --warm-soft:#F4E6DA;
    --slate:#3A5A72;
    --slate-soft:#DFE8EE;
    --alert:#9A3412;
    --alert-soft:#F7E2D8;
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(22,32,28,.06), 0 8px 24px -18px rgba(22,32,28,.5);
    --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
    --body:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#111614; --surface:#191F1C; --surface-2:#212925; --surface-3:#2A332E;
      --ink:#E7EDE8; --ink-2:#A2ADA6; --ink-3:#73807A;
      --line:#2A332E; --line-2:#39443D;
      --accent:#57C4A5; --accent-ink:#8FDCC3; --accent-soft:#15312A;
      --warm:#E0884F; --warm-soft:#33210F;
      --slate:#8DB2CE; --slate-soft:#1A2831;
      --alert:#F08A5D; --alert-soft:#341A11;
      --on-accent:#0B1512;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#111614; --surface:#191F1C; --surface-2:#212925; --surface-3:#2A332E;
    --ink:#E7EDE8; --ink-2:#A2ADA6; --ink-3:#73807A;
    --line:#2A332E; --line-2:#39443D;
    --accent:#57C4A5; --accent-ink:#8FDCC3; --accent-soft:#15312A;
    --warm:#E0884F; --warm-soft:#33210F;
    --slate:#8DB2CE; --slate-soft:#1A2831;
    --alert:#F08A5D; --alert-soft:#341A11;
    --on-accent:#0B1512;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  [hidden]{display:none !important;}
  h1,h2,h3,h4{font-family:var(--display); font-weight:700; line-height:1.15; margin:0; text-wrap:balance;}
  p{margin:0;}
  button{font:inherit; color:inherit; cursor:pointer; font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* ====================== structure ====================== */
  .app{
    height:100%;
    display:grid;
    grid-template-columns:74px 250px minmax(0,1fr) 236px;
    overflow:hidden;
  }
  .col{overflow-y:auto; overflow-x:hidden; min-width:0;}
  .spaces{background:var(--surface-2); border-right:1px solid var(--line); padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:7px;}
  .chans{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column;}
  .stage{display:flex; flex-direction:column; background:var(--ground);}
  .people{background:var(--surface); border-left:1px solid var(--line); padding:14px 13px 30px;}

  @media (max-width:1180px){
    .app{grid-template-columns:70px 230px minmax(0,1fr);}
    .people{display:none;}
  }
  @media (max-width:900px){
    html,body{height:auto;}
    .app{height:auto; grid-template-columns:minmax(0,1fr); overflow:visible;}
    .col{overflow:visible;}
    .spaces{flex-direction:row; justify-content:flex-start; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:9px 12px; position:sticky; top:0; z-index:12;}
    .chans{border-right:0; border-bottom:1px solid var(--line);}
    .chans-body{max-height:236px; overflow:auto;}
    .stage{min-height:60vh;}
    .composer{padding-bottom:104px;}
    .voicebar{position:fixed; left:0; right:0; bottom:0; z-index:30; border-top:1px solid var(--line); padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));}
    .feed-scroll{overflow:visible !important;}
  }

  /* ====================== espaces ====================== */
  .sp{
    width:46px; height:46px; flex:none; border-radius:15px; border:1px solid var(--line-2);
    background:var(--surface); color:var(--ink-2);
    font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:-.02em;
    display:grid; place-items:center; position:relative; transition:border-radius .15s, background .15s;
  }
  .sp:hover{border-radius:12px;}
  .sp[aria-current="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink); border-radius:12px;}
  .sp .bulle{
    position:absolute; right:-3px; top:-3px; min-width:17px; height:17px; padding:0 4px;
    border-radius:999px; background:var(--alert); color:#fff;
    font-family:var(--mono); font-size:9.5px; display:grid; place-items:center; border:2px solid var(--surface-2);
  }
  .sp-sep{width:26px; height:1px; background:var(--line-2); flex:none; margin:3px 0;}
  .sp-lab{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:-3px;}
  @media (max-width:900px){ .sp-lab{display:none;} .sp-sep{width:1px; height:26px; margin:0 4px;} }

  /* ====================== salons ====================== */
  .chans-head{padding:14px 15px 12px; border-bottom:1px solid var(--line);}
  .chans-head .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);}
  .chans-head h2{font-size:17px; letter-spacing:-.01em; margin-top:2px;}
  .chans-body{flex:1 1 auto; padding:10px 8px 14px;}
  .cgroup{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); padding:13px 8px 5px;}
  .ch{
    width:100%; display:grid; grid-template-columns:16px 1fr auto; gap:8px; align-items:center;
    background:transparent; border:0; border-radius:7px; padding:6px 8px; text-align:left; color:var(--ink-2);
  }
  .ch:hover{background:var(--surface-2);}
  .ch[aria-current="true"]{background:var(--surface-3); color:var(--ink);}
  .ch .hash{font-family:var(--mono); font-size:14px; color:var(--ink-3); text-align:center;}
  .ch .nm{font-size:14px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ch.unread .nm{font-weight:700; color:var(--ink);}
  .ch .cnt{font-family:var(--mono); font-size:9.5px; min-width:17px; height:17px; padding:0 5px; border-radius:999px; background:var(--alert); color:#fff; display:grid; place-items:center;}
  .ch .vc{font-family:var(--mono); font-size:10px; color:var(--ink-3);}
  .ch.live{color:var(--accent-ink);}
  .vmembers{display:grid; gap:3px; padding:1px 0 5px 32px;}
  .vmem{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2);}
  .vmem .avatar{width:20px; height:20px; font-size:8.5px;}

  /* ====================== barre vocale ====================== */
  .voicebar{background:var(--surface-2); border-top:1px solid var(--line); padding:9px 11px; display:grid; gap:8px;}
  .voicebar .state{display:flex; align-items:center; gap:8px;}
  .voicebar .state .led{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 0 3px var(--accent-soft);}
  .voicebar .state .txt{min-width:0;}
  .voicebar .state b{display:block; font-size:12.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .voicebar .state span{font-family:var(--mono); font-size:9.5px; color:var(--ink-3);}
  .vtools{display:flex; gap:5px; flex-wrap:wrap;}
  .vt{
    flex:1 1 auto; min-width:36px; height:32px; border-radius:8px; border:1px solid var(--line-2);
    background:var(--surface); color:var(--ink-2); display:grid; place-items:center; padding:0;
  }
  .vt:hover{border-color:var(--ink-3);}
  .vt[aria-pressed="true"]{background:var(--alert-soft); border-color:var(--alert); color:var(--alert);}
  .vt.quit{background:var(--alert); border-color:var(--alert); color:#fff; flex:0 0 42px;}
  .meter{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden;}
  .meter i{display:block; height:100%; width:0%; background:var(--accent); border-radius:3px; transition:width .07s linear;}
  .meter.muet i{background:var(--alert);}
  .ptt-hint{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); text-align:center;}

  /* ====================== scène ====================== */
  .stage-head{
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:10;
  }
  .stage-head .ttl{display:flex; align-items:baseline; gap:9px; min-width:0;}
  .stage-head h1{font-size:17px; letter-spacing:-.01em; white-space:nowrap;}
  .stage-head .sujet{font-size:12.5px; color:var(--ink-3); border-left:1px solid var(--line-2); padding-left:9px; min-width:0;}
  @media (max-width:640px){ .stage-head .sujet{display:none;} }
  .search{display:flex; align-items:center; gap:7px; background:var(--ground); border:1px solid var(--line); border-radius:8px; padding:5px 9px; margin-left:auto; max-width:250px; flex:1 1 150px;}
  .search input{border:0; background:transparent; font:inherit; font-size:13.5px; color:inherit; width:100%; outline:none; min-width:0;}
  .me-chip{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-3);}

  .feed-scroll{flex:1 1 auto; overflow-y:auto; padding:6px 0 4px;}
  .feed{padding:8px 18px 12px; display:flex; flex-direction:column; gap:2px;}

  /* ====================== messages ====================== */
  .msg{display:grid; grid-template-columns:38px minmax(0,1fr); gap:11px; padding:7px 10px; border-radius:9px;}
  .msg:hover{background:var(--surface);}
  .msg.pin{background:var(--warm-soft);}
  .msg .head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .msg .who{font-weight:700;}
  .msg .role{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:1px 5px; border-radius:4px;}
  .role.r-anim{background:var(--slate-soft); color:var(--slate);}
  .role.r-conseil{background:var(--accent-soft); color:var(--accent-ink);}
  .role.r-metier{background:var(--warm-soft); color:var(--warm);}
  .msg .when{font-family:var(--mono); font-size:10px; color:var(--ink-3);}
  .msg .pinflag{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--warm);}
  .msg .txt{margin-top:2px; max-width:68ch; overflow-wrap:anywhere;}
  .mention{background:var(--accent-soft); color:var(--accent-ink); border-radius:4px; padding:0 3px; font-weight:600;}
  .msg .from{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); margin-top:3px;}
  .reacts{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; align-items:center;}
  .react{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line-2); background:var(--surface); font-size:12.5px; line-height:1.5;
  }
  .react .n{font-family:var(--mono); font-size:10.5px; color:var(--ink-2);}
  .react[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}
  .react[aria-pressed="true"] .n{color:var(--accent-ink);}
  .react.add{color:var(--ink-3); font-size:13px; padding:2px 9px;}
  .picker{display:flex; gap:4px; padding:3px 5px; border:1px solid var(--line-2); border-radius:999px; background:var(--surface);}
  .picker button{background:transparent; border:0; font-size:15px; line-height:1; padding:2px 3px; border-radius:6px;}
  .picker button:hover{background:var(--surface-2);}
  .thread{margin-top:8px; border-left:2px solid var(--line-2); padding-left:12px; display:grid; gap:9px;}
  .thr{display:grid; grid-template-columns:24px minmax(0,1fr); gap:9px; font-size:14px;}
  .thr .head{display:flex; gap:7px; align-items:baseline; flex-wrap:wrap;}
  .thr .who{font-weight:600; font-size:13.5px;}
  .link-btn{background:transparent; border:0; padding:3px 0; font-size:12.5px; font-weight:600; color:var(--ink-3);}
  .link-btn:hover{color:var(--ink);}
  .typing{padding:2px 28px 8px; font-size:12.5px; color:var(--ink-3); font-style:italic; min-height:26px;}

  /* ====================== composer ====================== */
  .composer{padding:0 18px 16px;}
  .composer form{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 13px; display:grid; gap:7px;}
  .composer textarea{width:100%; min-height:40px; max-height:180px; resize:vertical; border:0; background:transparent; font:inherit; color:inherit; outline:none;}
  .composer .row{display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--ink-3);}
  .btn{background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); padding:6px 14px; border-radius:8px; font-size:13.5px; font-weight:600;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line-2);}
  .btn.ghost[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent);}
  .btn.sm{padding:4px 10px; font-size:12.5px;}
  .btn.warn{background:var(--alert); border-color:var(--alert); color:#fff;}

  /* ====================== vocal : scène ====================== */
  .vstage{padding:16px 18px 20px; display:grid; gap:14px; align-content:start;}
  .vnote{
    display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start;
    background:var(--warm-soft); border:1px solid color-mix(in srgb, var(--warm) 30%, transparent);
    border-radius:10px; padding:11px 13px; font-size:13px;
  }
  .vnote b{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--warm);}
  .tiles{display:grid; gap:11px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 12px 13px;
    display:grid; justify-items:center; gap:8px; text-align:center;
  }
  .tile .ring{border-radius:50%; padding:3px; border:2px solid transparent; transition:border-color .12s, box-shadow .12s;}
  .tile.parle .ring{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .tile .avatar{width:52px; height:52px; font-size:16px;}
  .tile .nm{font-size:13.5px; font-weight:700; line-height:1.2;}
  .tile .st{font-family:var(--mono); font-size:9.5px; color:var(--ink-3);}
  .tile .st.off{color:var(--alert);}
  .screen{background:#000; border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative;}
  .screen video{display:block; width:100%; max-height:46vh; background:#000;}
  .screen .cap{position:absolute; left:10px; top:10px; font-family:var(--mono); font-size:10px; background:rgba(0,0,0,.65); color:#fff; padding:3px 7px; border-radius:5px;}
  .vjoin{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}

  /* ====================== bibliothèque / agenda ====================== */
  .grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); padding:14px 18px 18px;}
  .prod{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px; display:grid; gap:7px; align-content:start;}
  .prod h4{font-size:15.5px; font-family:var(--body); font-weight:700; line-height:1.35;}
  .prod .by{font-size:12.5px; color:var(--ink-2);}
  .prod .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:3px; font-family:var(--mono); font-size:10.5px; color:var(--ink-3);}
  .pill{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:5px; background:var(--surface-2); color:var(--ink-2); justify-self:start; white-space:nowrap;}
  .pill.conseil{background:var(--accent-soft); color:var(--accent-ink);}
  .pill.metier{background:var(--warm-soft); color:var(--warm);}
  .pill.trans{background:var(--slate-soft); color:var(--slate);}

  .agenda{display:grid; gap:11px; padding:14px 18px 18px;}
  .ev{display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 15px;}
  @media (max-width:560px){ .ev{grid-template-columns:50px minmax(0,1fr);} .ev .cta{grid-column:2; justify-self:start;} }
  .ev .date{text-align:center; border-right:1px solid var(--line); padding-right:12px;}
  .ev .date .d{font-family:var(--display); font-size:22px; font-weight:800; line-height:1;}
  .ev .date .m{font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--ink-3);}
  .ev h4{font-size:15.5px; font-family:var(--body); font-weight:700;}
  .ev .det{font-size:12.5px; color:var(--ink-2); margin-top:2px;}
  .ev .bar{height:4px; border-radius:2px; background:var(--surface-2); margin-top:7px; overflow:hidden; max-width:220px;}
  .ev .bar i{display:block; height:100%; background:var(--accent); border-radius:2px;}
  .ev .bar i.full{background:var(--warm);}
  .ev .cta{display:grid; gap:6px; justify-items:stretch;}

  .empty{margin:24px 18px; background:var(--surface); border:1px dashed var(--line-2); border-radius:12px; padding:28px 22px; text-align:center;}
  .empty h3{font-size:17px; margin-bottom:6px;}
  .empty p{color:var(--ink-2); max-width:46ch; margin:0 auto 14px;}

  /* ====================== membres ====================== */
  .avatar{
    width:34px; height:34px; flex:none; border-radius:50%; display:grid; place-items:center;
    font-family:var(--mono); font-size:11.5px; font-weight:500;
    background:var(--accent-soft); color:var(--accent-ink); position:relative;
  }
  .avatar.sm{width:24px; height:24px; font-size:9.5px;}
  .avatar.metier{background:var(--warm-soft); color:var(--warm);}
  .avatar.anim{background:var(--slate-soft); color:var(--slate);}
  .avatar[data-st]::after{
    content:''; position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%;
    border:2px solid var(--surface); background:var(--ink-3);
  }
  .avatar[data-st="en-ligne"]::after{background:var(--accent);}
  .avatar[data-st="occupe"]::after{background:var(--alert);}
  .avatar[data-st="absent"]::after{background:var(--warm);}
  .people h3{font-family:var(--body); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin:16px 0 8px;}
  .people h3:first-child{margin-top:0;}
  .prow{display:grid; grid-template-columns:auto minmax(0,1fr); gap:9px; align-items:center; padding:5px 4px; border-radius:8px;}
  .prow:hover{background:var(--surface-2);}
  .prow .nm{font-size:13.5px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prow .jb{font-size:11.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .segsm{display:flex; gap:5px; margin-bottom:6px;}
  .segsm button{flex:1; padding:4px 6px; font-size:11.5px; font-weight:600; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink-2);}
  .segsm button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground);}
  .side-card{background:var(--ground); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-top:16px;}
  .side-card .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);}
  .side-card .t{font-size:13.5px; font-weight:700; line-height:1.25; margin:3px 0 2px;}

    h += '<button class="ch'+(n?' unread':'')+'" data-salon="'+s.id+'" aria-current="'+(ST.salon===s.id)+'">'
       + '<span class="hash">'+icone+'</span><span class="nm">'+esc(s.nom)+'</span>'
       + (n ? '<span class="cnt">'+n+'</span>' : '<span></span>') + '</button>';
  });

  h += '<div class="cgroup">Salons vocaux</div>';
  vocaux.forEach(function(s){
    var dedans = vocauxDe(s.id);
    h += '<button class="ch'+(dedans.length?' live':'')+'" data-salon="'+s.id+'" aria-current="'+(ST.salon===s.id)+'">'
       + '<span class="hash">🔊</span><span class="nm">'+esc(s.nom)+'</span>'
       + '<span class="vc">'+(dedans.length ? dedans.length+'/'+s.cap : '')+'</span></button>';
    if(dedans.length){
      h += '<div class="vmembers">' + dedans.map(function(id){
        var parle = (VOICE.salon===s.id && ((id===MOI && VOICE.niveau>12 && !VOICE.muet) || VOICE.parleur===id));
        return '<span class="vmem"'+(parle?' style="color:var(--accent-ink);font-weight:600"':'')+'>'+av(id,'sm')+esc(M[id].nom)+'</span>';
      }).join('') + '</div>';
    }
  });

  document.getElementById('salons').innerHTML = h;
  renderVoicebar();
}

/* ========================================================== rendu : barre vocale */
function renderVoicebar(){
  var bar = document.getElementById('voicebar');
  if(!VOICE.salon){
    bar.innerHTML = '<div class="state"><span class="led" style="background:var(--ink-3);box-shadow:none"></span>'
      + '<span class="txt"><b>Hors vocal</b><span>choisissez un salon 🔊</span></span></div>'
      + '<div class="state" style="gap:9px">' + av(MOI) + '<span class="txt"><b>Lionel B.</b><span>Animation nationale</span></span></div>';
    return;
  }
  var s = S[VOICE.salon];
  var etat = VOICE.micro==='ok' ? (VOICE.muet ? 'micro coupé' : 'micro ouvert') : (VOICE.micro==='refuse' ? 'écoute seule' : 'autorisation micro\u2026');
  bar.innerHTML =
    '<div class="state"><span class="led"></span><span class="txt"><b>'+esc(s.nom)+'</b><span>'+vocauxDe(s.id).length+' connectés · '+etat+'</span></span></div>'
  + '<div class="meter'+(VOICE.muet?' muet':'')+'" aria-hidden="true"><i id="meter-fill"></i></div>'
  + '<div class="vtools">'
  + '<button class="vt" data-v="mic" aria-pressed="'+VOICE.muet+'" title="Micro" aria-label="Couper ou rouvrir le micro">'+(VOICE.muet?'🔇':'🎙')+'</button>'
  + '<button class="vt" data-v="son" aria-pressed="'+VOICE.sourd+'" title="Son" aria-label="Couper ou rétablir le son">'+(VOICE.sourd?'🔈':'🎧')+'</button>'
  + '<button class="vt" data-v="ecran" aria-pressed="'+(!!VOICE.ecran)+'" title="Partager l’écran" aria-label="Partager l’écran">🖥</button>'
  + '<button class="vt quit" data-v="quit" title="Quitter le vocal" aria-label="Quitter le vocal">✕</button>'
  + '</div>'
  + '<div class="ptt-hint">'+(VOICE.muet && VOICE.micro==='ok' ? 'Maintenez la barre d’espace pour parler' : 'Espace = couper/parler')+'</div>';

/* ========================================================== rendu : scène */
function render(){
  renderEspaces();
  renderSalons();
  renderPeople();

  var s = S[ST.salon];
  var st = document.getElementById('stage');
  var icone = s.mode==='vocal' ? '🔊' : (s.mode==='biblio' ? '▤' : (s.mode==='agenda' ? '▦' : '#'));

  var h = '<header class="stage-head">'
    + '<span class="ttl"><h1>'+icone+' '+esc(s.nom)+'</h1>'
    + '<span class="sujet">'+esc(s.sujet)+'</span></span>'
    + '<label class="search"><span aria-hidden="true" style="color:var(--ink-3)">⌕</span>'
    + '<input id="q" type="search" placeholder="Rechercher dans le réseau" value="'+esc(ST.q)+'" autocomplete="off"></label>'
    + '</header>';

  if(ST.q){ h += vueRecherche(); }
  else if(s.mode==='vocal'){ h += vueVocal(s); }
  else if(s.mode==='biblio'){ h += vueBiblio(s); }
  else if(s.mode==='agenda'){ h += vueAgenda(s); }
  else { h += vueFil(s); }

  st.innerHTML = h;
  var fs = st.querySelector('.feed-scroll');
  if(fs && !ST.q) fs.scrollTop = fs.scrollHeight;
}

function vueFil(s){
  var msgs = messagesDe(s.id);
  var h = '<div class="feed-scroll"><div class="feed">';
  if(!msgs.length){
    h += '<div class="empty"><h3>Salon vide</h3><p>Une question ouverte lance mieux un salon qu’une annonce. Racontez un cas en cours, même bancal.</p></div>';
  } else {
    h += msgs.map(function(m){ return carte(m, false); }).join('');
  }
  h += '</div><div class="typing" id="typing"></div></div>' + composer(s);
  return h;
}

function carte(m, avecSalon){
  var a = M[m.a];
  var mes = ST.mesReacts[m.id] || {};
  var reacts = (m.r || []).map(function(r){
    var actif = !!mes[r.e];
    return '<button class="react" data-react="'+m.id+'|'+r.e+'" aria-pressed="'+actif+'">'
         + '<span aria-hidden="true">'+r.e+'</span><span class="n">'+(r.n + (actif?1:0))+'</span></button>';
  }).join('');
  Object.keys(mes).forEach(function(e){
    var connu = (m.r||[]).some(function(r){ return r.e===e; });
    if(!connu) reacts += '<button class="react" data-react="'+m.id+'|'+e+'" aria-pressed="true"><span aria-hidden="true">'+e+'</span><span class="n">1</span></button>';
  });
  if(ST.picker === m.id){
    reacts += '<span class="picker">' + EMOJIS.map(function(e){
      return '<button type="button" data-react="'+m.id+'|'+e+'" aria-label="Réagir '+e+'">'+e+'</button>';
    }).join('') + '</span>';
  } else {
    reacts += '<button class="react add" data-picker="'+m.id+'" aria-label="Ajouter une réaction">+</button>';
  }

  var rep = m.rep || [];
  var ouvert = !!ST.fils[m.id];
  var h = '<article class="msg'+(m.pin?' pin':'')+'">' + av(m.a) + '<div>';
  h += '<div class="head"><span class="who">'+esc(a.nom)+'</span>'
     + '<span class="role r-'+a.role+'">'+esc(ROLES[a.role])+'</span>'
     + (m.pin ? '<span class="pinflag">épinglé</span>' : '')
     + '<span class="when">'+esc(m.t)+'</span></div>';
  if(avecSalon) h += '<div class="from">'+esc(E[S[m.s].e].nom)+' · '+(S[m.s].mode==='vocal'?'🔊 ':'#')+esc(S[m.s].nom)+'</div>';
  h += '<p class="txt">'+riche(m.txt)+'</p>';
  h += '<div class="reacts">'+reacts
     + (rep.length ? '<button class="link-btn" data-fil="'+m.id+'" style="margin-left:6px">'+(ouvert?'Masquer le fil':rep.length+' réponse'+(rep.length>1?'s':''))+'</button>' : '')
     + '</div>';
  if(ouvert && rep.length){
    h += '<div class="thread">' + rep.map(function(r){
      return '<div class="thr">'+av(r.a,'sm')+'<div><div class="head"><span class="who">'+esc(M[r.a].nom)+'</span><span class="when">'+esc(r.t)+'</span></div><p>'+riche(r.txt)+'</p></div></div>';
    }).join('') + '</div>';
  }
  h += '</div></article>';
  return h;
}

function composer(s){
  var d = ST.draft[s.id] || '';
  return '<div class="composer"><form id="composer">'
    + '<textarea id="draft" rows="1" placeholder="Écrire dans '+(s.mode==='vocal'?'🔊 ':'#')+esc(s.nom)+'…">'+esc(d)+'</textarea>'
    + '<div class="row"><span class="hint">Entrée pour envoyer · @ pour mentionner quelqu’un</span>'
    + '<button class="btn" type="submit" id="envoyer"'+(d.trim().length<2?' disabled':'')+'>Envoyer</button></div>'
    + '</form></div>';
}

function vueVocal(s){
  var dedans = vocauxDe(s.id);
  var ici = VOICE.salon === s.id;
  var h = '<div class="feed-scroll"><div class="vstage">';

  if(ici && VOICE.micro === 'refuse'){
    h += '<div class="vnote"><span aria-hidden="true">🔇</span><div><b>Micro refusé</b><br>'
       + 'Ce navigateur a refusé l’accès au micro : vous restez en écoute. Pour l’ouvrir, autorisez le microphone depuis la barre d’adresse, puis rechargez la page.</div></div>';
  } else {
    h += '<div class="vnote"><span aria-hidden="true">🎙</span><div><b>Démo</b><br>'
       + 'Votre micro est réellement capté par ce navigateur : le vumètre et l’anneau vert suivent votre voix, et « couper » coupe la piste pour de bon. '
       + 'Rien n’est transmis ni enregistré — les autres participants sont simulés, faute de serveur vocal derrière cette démo.</div></div>';
  }

  if(!ici){
    h += '<div class="vjoin"><button class="btn" data-v="join|'+s.id+'">Rejoindre le vocal</button>'
       + '<span class="hint">'+(dedans.length ? dedans.length+' personne'+(dedans.length>1?'s':'')+' déjà là' : 'Personne pour l’instant')+' · '+s.cap+' places</span></div>';
  }

  if(VOICE.ecran && ici){
    h += '<div class="screen"><span class="cap">Votre écran · en direct</span><video id="screen-video" autoplay playsinline muted></video></div>';
  }

  if(dedans.length){
    h += '<div class="tiles">' + dedans.map(function(id){
      var moi = id === MOI;
      var parle = ici && (moi ? (VOICE.niveau > 12 && !VOICE.muet) : VOICE.parleur === id);
      var etat = moi
        ? (VOICE.micro==='ok' ? (VOICE.muet ? 'micro coupé' : 'micro ouvert') : (VOICE.micro==='refuse' ? 'écoute seule' : 'autorisation\u2026'))
        : 'simulé';
      return '<div class="tile'+(parle?' parle':'')+'"><span class="ring">'+av(id)+'</span>'
        + '<span class="nm">'+esc(M[id].nom)+(moi?' (vous)':'')+'</span>'
        + '<span class="st'+(moi && VOICE.muet ? ' off':'')+'">'+etat+'</span></div>';
    }).join('') + '</div>';

    h += '<div class="empty" style="margin:6px 0"><h3>Salon vocal vide</h3><p>'+esc(s.sujet)+'</p></div>';
  }

  h += '</div></div>';
  h += '<div style="padding:0 18px"><div style="border-top:1px solid var(--line)"></div></div>';

  if(msgs.length){

      '</div><div class="feed">' + msgs.map(function(m){ return carte(m,false); }).join('') + '</div></div><div style="padding:0 18px">');
  }
  h += composer(s);
  return h;

    }).join('') + '</div>';

function vueRecherche(){

    return (m.txt + ' ' + M[m.a].nom).toLowerCase().indexOf(q) > -1;
  });

/* ========================================================== rendu : membres */
function renderPeople(){
  var e = E[ST.espace];
  var list = MEMBRES.filter(function(m){
    if(e.region && m.region !== e.region && m.id !== MOI) return false;
    if(ST.role !== 'all' && m.role !== ST.role) return false;
    return true;
  });
  var enligne = list.filter(function(m){ return m.st==='en-ligne' || m.st==='occupe'; });
  var absents = list.filter(function(m){ return m.st==='absent'; });
  var off = list.filter(function(m){ return m.st==='hors-ligne'; });

  var h = '<div class="segsm" role="group" aria-label="Filtrer par rôle">'
    + [['all','Tous'],['conseil','Conseil'],['metier','Métier']].map(function(o){
        return '<button data-role="'+o[0]+'" aria-pressed="'+(ST.role===o[0])+'">'+o[1]+'</button>';
      }).join('') + '</div>';

  function bloc(titre, l){

    return '<h3>'+titre+' — '+l.length+'</h3>' + l.map(function(m){

    }).join('');
  }
  h += bloc('En ligne', enligne) + bloc('Absents', absents) + bloc('Hors ligne', off);

  var prochain = EVENTS[0];
  h += '<div class="side-card"><div class="k">Prochain rendez-vous</div>'
     + '<div class="t">'+esc(prochain.t)+'</div>'
     + '<div class="s">'+prochain.d+' '+prochain.m+' · '+esc(prochain.h)+'</div></div>';
  h += '<div class="side-card"><div class="k">Silence radio</div>'
     + '<div class="t">Occitanie · #mon-métier</div><div class="s">12 jours sans message</div></div>';
  h += '<p class="demo-strip" style="border:0;padding:14px 0 0"><b>Démo</b> Membres, messages et productions sont fictifs.</p>';

  document.getElementById('people').innerHTML = h;
}

/* ========================================================== vocal : moteur */
function majMetre(){
  if(!VOICE.analyser){ return; }
  VOICE.analyser.getByteTimeDomainData(VOICE.data);
  var somme = 0;
  for(var i=0;i<VOICE.data.length;i++){ var v = (VOICE.data[i]-128)/128; somme += v*v; }
  var niveau = Math.min(100, Math.round(Math.sqrt(somme/VOICE.data.length) * 320));
  var avant = VOICE.niveau > 12;
  VOICE.niveau = VOICE.muet ? 0 : niveau;
  var fill = document.getElementById('meter-fill');
  if(fill) fill.style.width = VOICE.niveau + '%';
  if((VOICE.niveau > 12) !== avant) majTuiles();
  VOICE.raf = requestAnimationFrame(majMetre);
}

function majTuiles(){
  var tiles = document.querySelectorAll('.tiles .tile');
  if(!tiles.length) return;
  var dedans = vocauxDe(VOICE.salon);
  tiles.forEach(function(t, i){
    var id = dedans[i];
    if(!id) return;
    var parle = id===MOI ? (VOICE.niveau > 12 && !VOICE.muet) : (VOICE.parleur === id);
    t.classList.toggle('parle', !!parle);
  });
  document.querySelectorAll('.vmem').forEach(function(el){ el.removeAttribute('style'); });
}

function rejoindre(sid){
  if(VOICE.salon === sid){ return; }
  if(VOICE.salon) quitter(true);
  VOICE.salon = sid;
  VOICE.muet = false; VOICE.sourd = false; VOICE.micro = 'attente';
  ST.salon = sid; ST.espace = S[sid].e;
  render();

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    VOICE.micro = 'refuse'; render(); return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}).then(function(stream){
    VOICE.stream = stream;
    VOICE.micro = 'ok';
    var AC = window.AudioContext || window.webkitAudioContext;
    VOICE.ctx = new AC();
    var src = VOICE.ctx.createMediaStreamSource(stream);
    VOICE.analyser = VOICE.ctx.createAnalyser();
    VOICE.analyser.fftSize = 512;
    VOICE.data = new Uint8Array(VOICE.analyser.fftSize);
    src.connect(VOICE.analyser);
    render();
    VOICE.raf = requestAnimationFrame(majMetre);
  }).catch(function(){
    VOICE.micro = 'refuse';
    render();
  });
}

function quitter(silencieux){
  if(VOICE.raf) cancelAnimationFrame(VOICE.raf);
  VOICE.raf = 0;
  if(VOICE.stream) VOICE.stream.getTracks().forEach(function(t){ t.stop(); });
  if(VOICE.ecran) VOICE.ecran.getTracks().forEach(function(t){ t.stop(); });
  if(VOICE.ctx && VOICE.ctx.close) { try{ VOICE.ctx.close(); }catch(e){} }
  VOICE.stream = null; VOICE.ecran = null; VOICE.ctx = null; VOICE.analyser = null;
  VOICE.salon = null; VOICE.niveau = 0; VOICE.muet = false; VOICE.micro = 'aucun'; VOICE.parleur = null;
  if(!silencieux) render();
}

function basculeMicro(force){
  VOICE.muet = (typeof force === 'boolean') ? force : !VOICE.muet;
  if(VOICE.stream){
    VOICE.stream.getAudioTracks().forEach(function(t){ t.enabled = !VOICE.muet; });
  }
  if(VOICE.muet) VOICE.niveau = 0;
  renderVoicebar();
  majTuiles();
}

function partagerEcran(){
  if(VOICE.ecran){
    VOICE.ecran.getTracks().forEach(function(t){ t.stop(); });
    VOICE.ecran = null; render(); return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){ signaler("Le partage d’écran n’est pas disponible dans ce navigateur."); return; }
  navigator.mediaDevices.getDisplayMedia({video:true, audio:false}).then(function(stream){
    VOICE.ecran = stream;
    stream.getVideoTracks()[0].addEventListener('ended', function(){ VOICE.ecran = null; render(); });
    render();
    var v = document.getElementById('screen-video');
    if(v){ v.srcObject = stream; }
  }).catch(function(){ /* annulé par l'utilisateur */ });
}

function signaler(txt){
  var t = document.getElementById('typing');
  if(t){ t.textContent = txt; setTimeout(function(){ if(t) t.textContent=''; }, 4000); }
}

/* parole simulée des autres participants */
setInterval(function(){
  if(!VOICE.salon) return;
  var autres = (VOCAUX[VOICE.salon] || []);
  if(!autres.length){ VOICE.parleur = null; return; }
  var r = Math.random();
  VOICE.parleur = r < 0.45 ? null : autres[Math.floor(Math.random()*autres.length)];
  majTuiles();
  var box = document.getElementById('salons');
  if(box) renderSalons();
}, 1400);

/* « est en train d'écrire » : décor de démo, salons textuels seulement */
setInterval(function(){
  var t = document.getElementById('typing');
  if(!t || ST.q) return;
  var s = S[ST.salon];
  if(!s || s.mode !== 'fil'){ return; }
  var candidats = MEMBRES.filter(function(m){ return m.st==='en-ligne' && m.id!==MOI && (!E[s.e].region || m.region===E[s.e].region); });
  if(!candidats.length) return;
  if(t.textContent){ t.textContent = ''; return; }
  if(Math.random() < 0.5){
    var c = candidats[Math.floor(Math.random()*candidats.length)];
    t.textContent = c.nom + ' est en train d’écrire…';
  }
}, 3800);

/* ========================================================== interactions */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-espace],[data-salon],[data-react],[data-picker],[data-fil],[data-venue],[data-role],[data-v],[data-copie]');
  if(!el) return;

  if(el.dataset.espace){
    ST.espace = el.dataset.espace;
    var prem = salonsDe(ST.espace)[0];
    if(prem){ ST.salon = prem.id; delete NONLUS[prem.id]; }
    ST.q = ''; ST.picker = null;
    render(); return;
  }
  if(el.dataset.salon){
    ST.salon = el.dataset.salon;
    ST.espace = S[ST.salon].e;
    delete NONLUS[ST.salon];
    ST.q = ''; ST.picker = null;
    try{ localStorage.setItem('maillage.salon', ST.salon); }catch(e){}
    if(S[ST.salon].mode === 'vocal' && VOICE.salon !== ST.salon){ render(); return; }
    render(); return;
  }
  if(el.dataset.react){
    var p = el.dataset.react.split('|');
    var mid = p[0], emo = p[1];
    ST.mesReacts[mid] = ST.mesReacts[mid] || {};
    if(ST.mesReacts[mid][emo]) delete ST.mesReacts[mid][emo]; else ST.mesReacts[mid][emo] = 1;
    ST.picker = null;
    render(); return;
  }
  if(el.dataset.picker){ ST.picker = (ST.picker === el.dataset.picker) ? null : el.dataset.picker; render(); return; }
  if(el.dataset.fil){
    var f = el.dataset.fil;
    if(ST.fils[f]) delete ST.fils[f]; else ST.fils[f] = 1;
    render(); return;
  }
  if(el.dataset.venue){
    var e2 = el.dataset.venue;
    if(ST.venue[e2]) delete ST.venue[e2]; else ST.venue[e2] = 1;
    render(); return;
  }
  if(el.dataset.role){ ST.role = el.dataset.role; renderPeople(); return; }
  if(el.dataset.copie){
    var txt = el.textContent; el.textContent = 'Dans votre bibliothèque';
    setTimeout(function(){ el.textContent = txt; }, 1600); return;
  }
  if(el.dataset.v){
    var v = el.dataset.v.split('|');
    if(v[0]==='join'){ rejoindre(v[1]); return; }
    if(v[0]==='quit'){ quitter(); return; }
    if(v[0]==='mic'){ basculeMicro(); return; }
    if(v[0]==='son'){ VOICE.sourd = !VOICE.sourd; renderVoicebar(); return; }
    if(v[0]==='ecran'){ partagerEcran(); return; }
  }
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'draft'){
    ST.draft[ST.salon] = ev.target.value;
    var b = document.getElementById('envoyer');
    if(b) b.disabled = ev.target.value.trim().length < 2;
  }
  if(ev.target.id === 'q'){
    ST.q = ev.target.value.trim();
    var pos = ev.target.selectionStart;
    render();
    var q2 = document.getElementById('q');
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} }
  }
});

document.addEventListener('submit', function(ev){
  if(ev.target.id !== 'composer') return;
  ev.preventDefault();
  envoyer();
});

function envoyer(){
  var ta = document.getElementById('draft');
  if(!ta) return;
  var txt = ta.value.trim();
  if(txt.length < 2) return;
  var d = new Date();
  var hh = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  ST.nouveaux.push({id:'n'+Date.now(), s:ST.salon, a:MOI, t:hh, r:[], rep:[], txt:txt});
  ST.draft[ST.salon] = '';
  render();
}

document.addEventListener('keydown', function(ev){
  var dansChamp = /^(INPUT|TEXTAREA)$/.test(ev.target.tagName);
  if((ev.key === 'Enter' || ev.key === 'Return') && !ev.shiftKey && ev.target.id === 'draft'){
    ev.preventDefault(); envoyer(); return;
  }
  if(ev.code === 'Space' && !dansChamp && VOICE.salon && VOICE.micro === 'ok'){
    ev.preventDefault();
    if(!VOICE.ptt){
      VOICE.ptt = true;
      if(VOICE.muet){ VOICE.pttTemporaire = true; basculeMicro(false); }
      else { VOICE.pttTemporaire = false; basculeMicro(true); }
    }
  }
});
document.addEventListener('keyup', function(ev){
  if(ev.code === 'Space' && VOICE.ptt){
    VOICE.ptt = false;
    if(VOICE.pttTemporaire) basculeMicro(true);
  }
});

render();
})();
</script>
</body>
</html>
