<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Maillage — réseau de formation IA</title>
<meta name="description" content="L'espace d'un réseau de formation à l'IA : un fil unique filtrable par région et par profil, une salle pour se parler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --papier:#F4F2ED;
    --blanc:#FFFFFF;
    --voile:#EAE7E0;
    --trait:#DDD9D0;
    --trait-fort:#C7C2B6;
    --encre:#1B2A33;
    --encre-2:#586870;
    --encre-3:#8A928C;
    --canard:#0E6470;
    --canard-clair:#DCEDEF;
    --cuivre:#B5603A;
    --cuivre-clair:#F6E7DF;
    --pousse:#3E7A55;
    --pousse-clair:#E0EDE4;
    --sur-canard:#FFFFFF;
    --ombre:0 1px 2px rgba(27,42,51,.05), 0 12px 28px -22px rgba(27,42,51,.55);
    --titre:'Newsreader', Georgia, 'Times New Roman', serif;
    --texte:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --papier:#12181C; --blanc:#192126; --voile:#212B31; --trait:#28343A; --trait-fort:#3A484F;
      --encre:#E9EEEC; --encre-2:#A3B0B3; --encre-3:#77868A;
      --canard:#5FC3CE; --canard-clair:#12333A; --cuivre:#E0906A; --cuivre-clair:#33211A;
      --pousse:#74B98D; --pousse-clair:#182E22; --sur-canard:#0B1518;
      --ombre:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -22px rgba(0,0,0,.95);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --papier:#12181C; --blanc:#192126; --voile:#212B31; --trait:#28343A; --trait-fort:#3A484F;
    --encre:#E9EEEC; --encre-2:#A3B0B3; --encre-3:#77868A;
    --canard:#5FC3CE; --canard-clair:#12333A; --cuivre:#E0906A; --cuivre-clair:#33211A;
    --pousse:#74B98D; --pousse-clair:#182E22; --sur-canard:#0B1518;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -22px rgba(0,0,0,.95);
  }

  *{box-sizing:border-box;}
  html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{margin:0; background:var(--papier); color:var(--encre); font-family:var(--texte); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  h1,h2,h3{margin:0; font-family:var(--titre); font-weight:500; line-height:1.18; letter-spacing:-.01em; text-wrap:balance;}
  p{margin:0;}
  button{font:inherit; font-family:var(--texte); color:inherit; cursor:pointer;}
  a{color:var(--canard);}
  :focus-visible{outline:2px solid var(--canard); outline-offset:3px; border-radius:3px;}

  /* ---------- bandeau d'état ---------- */
  .bandeau{
    background:var(--cuivre-clair); color:var(--cuivre);
    border-bottom:1px solid color-mix(in srgb, var(--cuivre) 28%, transparent);
    font-size:13px; line-height:1.45;
  }
  .bandeau .dedans{max-width:1120px; margin:0 auto; padding:9px 22px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
  .bandeau b{font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px;}

  /* ---------- en-tête ---------- */
  .top{border-bottom:1px solid var(--trait); background:var(--papier); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
  .top-in{max-width:1120px; margin:0 auto; padding:13px 22px; display:flex; align-items:center; gap:14px;}
  .marque{font-family:var(--titre); font-size:21px; font-weight:600; letter-spacing:-.015em; margin-right:auto;}
  .marque span{color:var(--canard);}
  .jour{font-size:13px; color:var(--encre-3);}
  @media (max-width:640px){ .jour{display:none;} }
  .burger{display:none; width:38px; height:38px; border:1px solid var(--trait); border-radius:9px; background:var(--blanc); place-items:center; padding:0;}

  /* ---------- structure ---------- */
  .cadre{max-width:1120px; margin:0 auto; padding:0 22px; display:grid; grid-template-columns:230px minmax(0,1fr); gap:38px; align-items:start;}
  @media (max-width:900px){
    .cadre{grid-template-columns:minmax(0,1fr); gap:0; padding-inline:16px;}
    .burger{display:grid;}
    .menu{
      position:fixed; inset:0; z-index:40; background:var(--papier);
      padding:20px 22px calc(28px + env(safe-area-inset-bottom,0px));
      overflow-y:auto; display:none;
    }
    .menu.ouvert{display:block;}
    .menu .fermer{display:block !important; width:fit-content; margin-left:auto;}
  }

  /* ---------- menu ---------- */
  .menu{position:sticky; top:calc(env(safe-area-inset-top,0px) + 74px); padding-block:26px 40px;}
  .menu .fermer{display:none; width:100%; justify-content:flex-end; margin-bottom:14px;}
  .m-groupe{margin-bottom:24px;}
  .m-titre{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--encre-3); margin-bottom:9px; padding-left:11px;}
  .m-lien{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:none; border:0; border-radius:9px; padding:7px 11px;
    font-size:15px; color:var(--encre-2); line-height:1.35;
  }
  .m-lien:hover{background:var(--voile);}
  .m-lien[aria-current="true"]{background:var(--blanc); color:var(--encre); font-weight:600; box-shadow:var(--ombre);}
  .m-lien .n{margin-left:auto; font-size:12.5px; color:var(--encre-3); font-variant-numeric:tabular-nums;}
  .m-lien[aria-current="true"] .n{color:var(--canard);}
  .m-lien.region{font-size:14.5px; padding-block:6px;}
  .m-lien .pastille{width:7px; height:7px; border-radius:50%; flex:none; background:var(--trait-fort);}
  .m-lien.region[aria-current="true"] .pastille{background:var(--canard);}
  .m-lien.profil .pastille.c{background:var(--canard);}
  .m-lien.profil .pastille.m{background:var(--cuivre);}
  .menu .moi{display:flex; align-items:center; gap:10px; padding:11px; border-top:1px solid var(--trait); margin-top:6px;}
  .menu .moi .nom{font-size:14px; font-weight:600; line-height:1.25;}
  .menu .moi .role{font-size:12.5px; color:var(--encre-3);}

  /* ---------- contenu ---------- */
  .page{padding-block:30px 130px; max-width:680px;}
  .chapeau{margin-bottom:30px;}
  .sur-titre{font-size:12.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--encre-3); margin-bottom:8px;}
  h1{font-size:31px;}
  @media (max-width:430px){ h1{font-size:26px;} }
  .chapeau p{color:var(--encre-2); margin-top:10px; max-width:58ch;}
  .cadrage{font-size:13.5px; color:var(--encre-3); margin-top:12px;}
  .cadrage b{color:var(--encre-2); font-weight:600;}

  section + section{margin-top:36px;}
  .titre-section{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--trait);}
  .titre-section h2{font-size:19px;}
  .titre-section .note{font-size:13px; color:var(--encre-3); margin-left:auto; white-space:nowrap;}

  /* ---------- boutons ---------- */
  .b{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--canard); color:var(--sur-canard); border:1px solid var(--canard);
    padding:9px 17px; border-radius:9px; font-size:15px; font-weight:600;
  }
  .b:hover{filter:brightness(1.08);}
  .b:disabled{opacity:.45; cursor:not-allowed;}
  .b.creux{background:transparent; color:var(--encre); border-color:var(--trait-fort);}
  .b.creux:hover{border-color:var(--encre-2); filter:none;}
  .b.chaud{background:var(--cuivre); border-color:var(--cuivre); color:#fff;}
  .b.petit{padding:6px 12px; font-size:14px; border-radius:8px;}
  .lien{background:none; border:0; padding:4px 0; font-size:14px; font-weight:600; color:var(--canard); text-decoration:underline; text-underline-offset:3px;}
  .lien:hover{color:var(--encre);}

  /* ---------- salle ---------- */
  .salle{
    display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
    background:var(--blanc); border:1px solid var(--trait); border-radius:14px; padding:16px 18px; box-shadow:var(--ombre);
  }
  .salle.active{background:var(--cuivre-clair); border-color:color-mix(in srgb, var(--cuivre) 35%, transparent);}
  @media (max-width:560px){ .salle{grid-template-columns:auto 1fr; gap:12px;} .salle .b{grid-column:1 / -1; width:100%;} }
  .salle .qui{font-size:15.5px; line-height:1.4; font-weight:700;}
  .salle .sous{font-size:13.5px; color:var(--encre-2); margin-top:3px;}
  .onde{display:flex; align-items:flex-end; gap:3px; height:26px;}
  .onde i{width:3px; border-radius:2px; background:var(--cuivre); height:6px;}
  .onde.vit i{animation:onde 1.1s ease-in-out infinite;}
  .onde i:nth-child(2){animation-delay:.14s} .onde i:nth-child(3){animation-delay:.28s}
  .onde i:nth-child(4){animation-delay:.42s} .onde i:nth-child(5){animation-delay:.56s}
  @keyframes onde{0%,100%{height:6px}50%{height:24px}}
  .onde.dort i{background:var(--encre-3); opacity:.45;}

  /* ---------- écrire ---------- */
  .ecrire{background:var(--blanc); border:1px solid var(--trait); border-radius:14px; padding:14px 16px; box-shadow:var(--ombre);}
  .ecrire .choix{display:flex; gap:7px; margin-bottom:11px; flex-wrap:wrap;}
  .ecrire textarea{width:100%; min-height:62px; resize:vertical; border:0; background:transparent; font:inherit; color:inherit; outline:none; line-height:1.55;}
  .ecrire textarea::placeholder{color:var(--encre-3);}
  .ecrire .bas{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; margin-top:10px; padding-top:11px; border-top:1px solid var(--trait);}
  .conseil{font-size:13px; color:var(--encre-3); max-width:44ch;}

  /* ---------- filtres actifs ---------- */
  .actifs{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:22px 0 4px; font-size:13.5px; color:var(--encre-3);}
  .jeton{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--blanc); border:1px solid var(--trait); border-radius:999px; padding:4px 7px 4px 12px; font-size:13.5px; color:var(--encre);
  }
  .jeton button{background:none; border:0; padding:0 3px; color:var(--encre-3); font-size:15px; line-height:1;}
  .jeton button:hover{color:var(--cuivre);}

  /* ---------- fil ---------- */
  .mot{padding:22px 0; border-bottom:1px solid var(--trait);}
  .mot .tete{display:flex; align-items:center; gap:11px; margin-bottom:11px;}
  .mot .nom{font-weight:700; font-size:15px; line-height:1.3;}
  .mot .ident{font-size:13px; color:var(--encre-3); line-height:1.35;}
  .mot .quand{margin-left:auto; font-size:12.5px; color:var(--encre-3); white-space:nowrap; text-align:right;}
  .etiq{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:6px;}
  .etiq.q{background:var(--cuivre-clair); color:var(--cuivre);}
  .etiq.ok{background:var(--pousse-clair); color:var(--pousse);}
  .etiq.part{background:var(--canard-clair); color:var(--canard);}
  .mot .corps{font-size:16.5px; line-height:1.6; max-width:62ch;}
  .mot .corps.serif{font-family:var(--titre); font-size:20px; line-height:1.48;}
  .mot .actions{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:13px;}
  .reponses{margin-top:16px; display:grid; gap:15px; border-left:2px solid var(--trait); padding-left:16px;}
  .rep{display:grid; grid-template-columns:auto 1fr; gap:11px;}
  .rep .nom{font-weight:600; font-size:14.5px;}
  .rep .quand{font-size:12.5px; color:var(--encre-3);}
  .rep .corps{font-size:15.5px; margin-top:2px; line-height:1.55;}
  .repondre{margin-top:15px; display:grid; gap:9px;}
  .repondre textarea{width:100%; min-height:66px; border:1px solid var(--trait); border-radius:10px; background:var(--blanc); font:inherit; color:inherit; padding:11px 13px; outline:none; resize:vertical;}
  .repondre textarea:focus{border-color:var(--canard);}
  .repondre .bas{display:flex; gap:12px; align-items:center;}

  /* ---------- pastille ---------- */
  .past{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--voile); color:var(--encre-2);}
  .past.pt{width:28px; height:28px; font-size:11px;}
  .past.c{background:var(--canard-clair); color:var(--canard);}
  .past.m{background:var(--cuivre-clair); color:var(--cuivre);}
  .past.a{background:var(--pousse-clair); color:var(--pousse);}

  /* ---------- listes vides ---------- */
  .vide{padding:34px 24px; text-align:center; border:1px dashed var(--trait-fort); border-radius:13px; color:var(--encre-2); background:var(--blanc);}
  .vide h3{font-size:18.5px; margin-bottom:7px; color:var(--encre);}
  .vide p{max-width:46ch; margin:0 auto 16px; font-size:15px;}
  .vide .mini{font-size:13px; color:var(--encre-3); margin-top:12px;}

  /* ---------- ressources / dates ---------- */
  .cherche{display:flex; align-items:center; gap:10px; background:var(--blanc); border:1px solid var(--trait); border-radius:11px; padding:10px 14px; margin-bottom:18px;}
  .cherche input{border:0; background:transparent; font:inherit; color:inherit; width:100%; outline:none; min-width:0;}
  .res{display:grid; grid-template-columns:auto 1fr auto; gap:15px; align-items:center; padding:17px 0; border-bottom:1px solid var(--trait);}
  @media (max-width:560px){ .res{grid-template-columns:auto 1fr;} .res .b{grid-column:2; justify-self:start;} }
  .res .type{width:46px; height:46px; border-radius:11px; display:grid; place-items:center; background:var(--voile); color:var(--encre-2); font-size:11px; font-weight:700; text-transform:uppercase;}
  .res h3{font-family:var(--texte); font-size:16px; font-weight:700; line-height:1.35;}
  .res .par{font-size:13.5px; color:var(--encre-2); margin-top:3px;}

  .date-l{display:grid; grid-template-columns:76px 1fr auto; gap:18px; align-items:center; padding:18px 0; border-bottom:1px solid var(--trait);}
  @media (max-width:560px){ .date-l{grid-template-columns:58px 1fr;} .date-l .cta{grid-column:2; justify-self:start;} }
  .date-l .cal{text-align:center;}
  .date-l .cal .j{font-family:var(--titre); font-size:30px; font-weight:600; line-height:1;}
  .date-l .cal .m{font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--encre-3); margin-top:2px;}
  .date-l h3{font-family:var(--texte); font-size:16.5px; font-weight:700;}
  .date-l .ou{font-size:13.5px; color:var(--encre-2); margin-top:3px;}

  /* ---------- barre flottante ---------- */
  .dock{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(680px, calc(100% - 32px)); z-index:45;
    background:var(--encre); color:var(--papier);
    border-radius:15px; padding:11px 13px;
    display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center;
    box-shadow:0 10px 34px -12px rgba(0,0,0,.5);
  }
  .dock .titre{font-size:14.5px; font-weight:700; line-height:1.25;}
  .dock .sous{font-size:12.5px; opacity:.72; line-height:1.3;}
  .dock .outils{display:flex; gap:7px;}
  .dock .o{width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:var(--papier); display:grid; place-items:center; padding:0;}
  .dock .o:hover{background:rgba(255,255,255,.16);}
  .dock .o[aria-pressed="true"]{background:var(--cuivre); border-color:var(--cuivre); color:#fff;}
  .dock .o.sortir{background:transparent;}
  .vu{display:flex; align-items:flex-end; gap:2.5px; height:22px; width:36px;}
  .vu i{width:3px; background:var(--pousse); border-radius:2px; height:3px; transition:height .08s linear;}
  .vu.coupe i{background:var(--cuivre);}
  @media (max-width:560px){ .dock{grid-template-columns:1fr auto; gap:10px;} .dock .vu{display:none;} .dock .o{width:38px; height:38px;} }

  .ecran{margin-top:16px; border-radius:13px; overflow:hidden; background:#000; border:1px solid var(--trait); position:relative;}
  .ecran video{display:block; width:100%; max-height:44vh; background:#000;}
  .ecran .lg{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.66); color:#fff; font-size:12px; padding:3px 9px; border-radius:6px;}

  .acces{max-width:440px; margin:8vh auto 0;}
  .acces h1{font-size:30px; margin-bottom:12px;}
  .acces p{color:var(--encre-2); margin-bottom:20px;}
  .acces .sur-titre{margin-bottom:10px;}
  .form-acces{display:grid; gap:10px;}
  .form-acces input{
    width:100%; padding:11px 14px; font:inherit; color:inherit;
    background:var(--blanc); border:1px solid var(--trait); border-radius:10px; outline:none;
  }
  .form-acces input:focus{border-color:var(--canard);}
  .alerte{margin-top:16px; padding:11px 14px; border-radius:10px; background:var(--cuivre-clair); color:var(--cuivre); font-size:14px;}
  .pied{border-top:1px solid var(--trait); margin-top:44px; padding-top:18px; font-size:13px; color:var(--encre-3); max-width:60ch;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<div class="bandeau" id="bandeau" hidden>
  <div class="dedans" id="bandeau-texte"></div>
</div>

<header class="top">
  <div class="top-in">
    <span class="marque">Le M<span>ai</span>llage</span>
    <span class="jour" id="jour"></span>
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<div class="cadre">
  <nav class="menu" id="menu" aria-label="Navigation"></nav>
  <main class="page" id="page"></main>
</div>

<div id="dock"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   L'espace est vide : il n'y a aucun message, aucune ressource
   et aucune date. Seules restent les structures — les régions,
   les deux profils, et la personne connectée.
   ============================================================ */

/* ------------------------------------------------------------------
   Branchement Supabase. Tant que ces deux lignes sont vides, le site
   tourne en maquette : ce qu'on écrit reste dans l'onglet.
   Où les trouver : Supabase → Project Settings → Data API →
   « Project URL », et la clé « publishable » (anon).
   Elles sont publiques par nature : ce sont les règles RLS qui
   protègent les données, jamais le secret de la clé. Ne JAMAIS mettre
   ici la clé « service_role ».
   ------------------------------------------------------------------ */
var SUPABASE_URL = '';
var SUPABASE_KEY = '';

var EN_LIGNE = !!(SUPABASE_URL && SUPABASE_KEY && window.supabase);
var sb = EN_LIGNE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* etat : maquette | chargement | connexion | envoye | non-membre | pret */
var SESSION = {etat: EN_LIGNE ? 'chargement' : 'maquette', email:'', message:'', occupe:false};

var MOI = {id:'moi', nom:'Vous', ini:'VO', metier:'', region:'aura', profil:'anim'};
var GENS = {}; GENS[MOI.id] = MOI;

function initiales(nom){
  var m = String(nom || '').trim().split(/\s+/).filter(Boolean);
  if(!m.length) return '??';
  return (m.length === 1 ? m[0].slice(0,2) : m[0][0] + m[m.length-1][0]).toUpperCase();
}

var REGIONS = [
  {id:'aura', nom:'Auvergne-Rhône-Alpes'},
  {id:'bfc', nom:'Bourgogne-Franche-Comté'},
  {id:'bretagne', nom:'Bretagne'},
  {id:'cvl', nom:'Centre-Val de Loire'},
  {id:'corse', nom:'Corse'},
  {id:'grandest', nom:'Grand Est'},
  {id:'hdf', nom:'Hauts-de-France'},
  {id:'idf', nom:'Île-de-France'},
  {id:'normandie', nom:'Normandie'},
  {id:'na', nom:'Nouvelle-Aquitaine'},
  {id:'occitanie', nom:'Occitanie'},
  {id:'pdl', nom:'Pays de la Loire'},
  {id:'paca', nom:"Provence-Alpes-Côte d'Azur"},
  {id:'om', nom:'Outre-mer'}
];
var R = {}; REGIONS.forEach(function(r){ R[r.id] = r; });

var PROFILS = [
  {id:'conseil', nom:'Conseillers IA', court:'conseillers', c:'c'},
  {id:'metier', nom:"L'IA dans mon métier", court:'praticiens', c:'m'}
];
var P = {}; PROFILS.forEach(function(p){ P[p.id] = p; });

/* Tout part vide. Ce que vous écrivez vient s'ajouter ici, le temps de l'onglet. */
var FIL = [];
var RESSOURCES = [];
var DATES = [];
var DANS_LA_SALLE = [];

/* ===================================================== Supabase */
async function initialiser(){
  var res = await sb.auth.getSession();
  ecouterAuth();
  if(!res.data.session){ SESSION.etat = 'connexion'; rendre(); return; }
  await ouvrirSession();
}

function ecouterAuth(){
  sb.auth.onAuthStateChange(function(evenement){
    if(evenement === 'SIGNED_IN' && SESSION.etat !== 'pret') ouvrirSession();
    if(evenement === 'SIGNED_OUT'){ SESSION.etat = 'connexion'; FIL = []; rendre(); }
  });
}

async function ouvrirSession(){
  SESSION.etat = 'chargement'; rendre();
  var u = await sb.auth.getUser();
  var compte = u.data && u.data.user;
  if(!compte){ SESSION.etat = 'connexion'; rendre(); return; }
  SESSION.email = compte.email || '';

  var fiche = await sb.from('membres').select('*').eq('id', compte.id).maybeSingle();
  if(fiche.error || !fiche.data){ SESSION.etat = 'non-membre'; rendre(); return; }

  MOI = {id:fiche.data.id, nom:fiche.data.nom || SESSION.email, ini:initiales(fiche.data.nom || SESSION.email),
         metier:fiche.data.metier || '', region:fiche.data.region || 'aura', profil:fiche.data.profil || 'metier'};
  GENS[MOI.id] = MOI;

  SESSION.etat = 'pret';
  await chargerTout();
  abonner();
  rendre();
}

async function chargerTout(){
  var gens = await sb.from('membres').select('id,nom,metier,region,profil');
  if(gens.data){
    GENS = {};
    gens.data.forEach(function(m){
      GENS[m.id] = {id:m.id, nom:m.nom || 'Sans nom', ini:initiales(m.nom), metier:m.metier || '',
                    region:m.region || 'aura', profil:m.profil || 'metier'};
    });
    if(GENS[MOI.id]) MOI = GENS[MOI.id]; else GENS[MOI.id] = MOI;
  }

  var msg = await sb.from('messages')
    .select('id,auteur,type,texte,cree_le,reponses(id,auteur,texte,cree_le),utiles(membre)')
    .order('cree_le', {ascending:false});
  if(msg.error){ SESSION.message = 'Lecture impossible : ' + msg.error.message; FIL = []; return; }

  ET.utiles = {};
  FIL = (msg.data || []).map(function(m){
    if((m.utiles || []).some(function(u){ return u.membre === MOI.id; })) ET.utiles[m.id] = 1;
    return {
      id:m.id, qui:m.auteur, type:m.type, txt:m.texte, t:new Date(m.cree_le).getTime(),
      nbUtiles:(m.utiles || []).length,
      rep:(m.reponses || []).sort(function(a,b){ return new Date(a.cree_le) - new Date(b.cree_le); })
          .map(function(r){ return {qui:r.auteur, txt:r.texte, t:new Date(r.cree_le).getTime()}; })
    };
  });

  var ev = await sb.from('evenements').select('id,titre,le_jour,horaire,lieu,visio,places').order('le_jour');
  DATES = (ev.data || []).map(function(e){
    return {id:e.id, iso:e.le_jour, t:e.titre,
            ou:[e.horaire, e.lieu].filter(Boolean).join(' · '), visio:e.visio};
  });
}

var canal = null, minuteur = null;
function abonner(){
  if(canal) return;
  canal = sb.channel('maillage')
    .on('postgres_changes', {event:'*', schema:'public', table:'messages'}, rafraichir)
    .on('postgres_changes', {event:'*', schema:'public', table:'reponses'}, rafraichir)
    .subscribe();
}
function rafraichir(){
  clearTimeout(minuteur);
  minuteur = setTimeout(function(){ chargerTout().then(rendre); }, 400);
}

async function envoyerLien(email){
  SESSION.occupe = true; SESSION.message = ''; rendre();
  var r = await sb.auth.signInWithOtp({email:email, options:{emailRedirectTo:location.origin}});
  SESSION.occupe = false;
  if(r.error){ SESSION.message = r.error.message; rendre(); return; }
  SESSION.email = email; SESSION.etat = 'envoye'; rendre();
}

async function seDeconnecter(){ await sb.auth.signOut(); }

async function publierMot(txt, type){
  if(!EN_LIGNE){
    FIL.unshift({id:'m' + Date.now(), qui:MOI.id, type:type, t:Date.now(), txt:txt, rep:[], nbUtiles:0});
    return;
  }
  var r = await sb.from('messages').insert({auteur:MOI.id, type:type, texte:txt});
  if(r.error){ SESSION.message = 'Publication refusée : ' + r.error.message; return; }
  await chargerTout();
}

async function publierReponse(idMessage, txt){
  if(!EN_LIGNE){
    var c = FIL.filter(function(m){ return m.id === idMessage; })[0];
    if(c) c.rep.push({qui:MOI.id, t:Date.now(), txt:txt});
    return;
  }
  var r = await sb.from('reponses').insert({message:idMessage, auteur:MOI.id, texte:txt});
  if(r.error){ SESSION.message = 'Réponse refusée : ' + r.error.message; return; }
  await chargerTout();
}

async function basculerUtile(idMessage){
  var avant = !!ET.utiles[idMessage];
  if(avant) delete ET.utiles[idMessage]; else ET.utiles[idMessage] = 1;
  if(!EN_LIGNE) return;
  if(avant) await sb.from('utiles').delete().eq('message', idMessage).eq('membre', MOI.id);
  else      await sb.from('utiles').insert({message:idMessage, membre:MOI.id});
  await chargerTout();
}

/* ===================================================== état */
var ET = {
  vue:'aujourdhui', region:'toutes', profil:'tous',
  type:'question', brouillon:'', repond:null, cherche:'',
  utiles:{}, menuOuvert:false
};
var VOIX = {dedans:false, flux:null, ctx:null, analyseur:null, tampon:null, raf:0,
            coupe:false, micro:'aucun', niveau:0, ecran:null, ptt:false, pttTemp:false};

function ech(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function qui(id){ return GENS[id] || MOI; }
function past(id, t){
  var p = qui(id);
  var v = p.profil === 'conseil' ? 'c' : (p.profil === 'metier' ? 'm' : 'a');
  return '<span class="past ' + v + (t ? ' ' + t : '') + '" title="' + ech(p.nom) + '">' + ech(p.ini) + '</span>';
}
function depuis(t){
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return "à l'instant";
  if(m < 60) return 'il y a ' + m + ' min';
  var h = Math.round(m / 60);
  if(h < 24) return 'il y a ' + h + ' h';
  var j = Math.round(h / 24);
  return j === 1 ? 'hier' : 'il y a ' + j + ' jours';
}
function filtre(liste){
  return liste.filter(function(x){
    var p = qui(x.qui);
    if(ET.region !== 'toutes' && p.region !== ET.region) return false;
    if(ET.profil !== 'tous' && p.profil !== ET.profil) return false;
    return true;
  });
}
function sansReponse(){
  return filtre(FIL).filter(function(m){ return m.type === 'question' && !m.rep.length; });
}
function nbSalle(){ return DANS_LA_SALLE.length + (VOIX.dedans ? 1 : 0); }
function cadreCourant(){
  var bouts = [];
  bouts.push(ET.region === 'toutes' ? 'Toutes les régions' : R[ET.region].nom);
  if(ET.profil !== 'tous') bouts.push(P[ET.profil].nom);
  return bouts.join(' · ');
}

/* ===================================================== menu */
var VUES = [
  {id:'aujourdhui', nom:"Aujourd'hui"},
  {id:'echanges', nom:'Échanges'},
  {id:'ressources', nom:'Ressources'},
  {id:'dates', nom:'Dates'}
];

function rendreMenu(){
  var n = sansReponse().length;
  var h = '<button class="b creux petit fermer" data-menu="fermer">Fermer</button>';

  h += '<div class="m-groupe"><div class="m-titre">L’espace</div>'
    + VUES.map(function(v){
        var marque = '';
        if(v.id === 'echanges' && n) marque = '<span class="n">' + n + '</span>';
        if(v.id === 'ressources' && RESSOURCES.length) marque = '<span class="n">' + RESSOURCES.length + '</span>';
        if(v.id === 'dates' && DATES.length) marque = '<span class="n">' + DATES.length + '</span>';
        return '<button class="m-lien" data-vue="' + v.id + '" aria-current="' + (ET.vue === v.id) + '">'
          + v.nom + marque + '</button>';
      }).join('') + '</div>';

  h += '<div class="m-groupe"><div class="m-titre">Régions</div>'
    + '<button class="m-lien region" data-region="toutes" aria-current="' + (ET.region === 'toutes') + '">'
    + '<span class="pastille"></span>Toutes les régions</button>'
    + REGIONS.map(function(r){
        var nb = FIL.filter(function(m){ return qui(m.qui).region === r.id; }).length;
        return '<button class="m-lien region" data-region="' + r.id + '" aria-current="' + (ET.region === r.id) + '">'
          + '<span class="pastille"></span>' + ech(r.nom)
          + (nb ? '<span class="n">' + nb + '</span>' : '') + '</button>';
      }).join('') + '</div>';

  h += '<div class="m-groupe"><div class="m-titre">Profil</div>'
    + '<button class="m-lien profil" data-profil="tous" aria-current="' + (ET.profil === 'tous') + '">'
    + '<span class="pastille"></span>Les deux</button>'
    + PROFILS.map(function(p){
        var nb = FIL.filter(function(m){ return qui(m.qui).profil === p.id; }).length;
        return '<button class="m-lien profil" data-profil="' + p.id + '" aria-current="' + (ET.profil === p.id) + '">'
          + '<span class="pastille ' + p.c + '"></span>' + ech(p.nom)
          + (nb ? '<span class="n">' + nb + '</span>' : '') + '</button>';
      }).join('') + '</div>';

  h += '<div class="moi">' + past(MOI.id) + '<div><div class="nom">' + ech(MOI.nom) + '</div>'
    + '<div class="role">' + ech(MOI.metier) + '</div></div></div>';

  var menu = document.getElementById('menu');
  menu.innerHTML = h;
  menu.classList.toggle('ouvert', ET.menuOuvert);
  document.getElementById('burger').setAttribute('aria-expanded', String(ET.menuOuvert));
}

/* ===================================================== aujourd'hui */
function vueAujourdhui(){
  var attentes = sansReponse();
  var messages = filtre(FIL);
  var dedans = nbSalle();

  var titre, chapeau;
  if(!FIL.length && !RESSOURCES.length && !DATES.length){
    titre = "L'espace est prêt, il n'attend que vous";
    chapeau = "Rien n'a encore été écrit. Le premier message donne le ton du groupe : "
            + "une question précise appelle des questions précises, une annonce appelle le silence.";
  } else {
    var bouts = [];
    if(attentes.length) bouts.push(attentes.length + (attentes.length > 1 ? ' questions attendent' : ' question attend'));
    if(dedans) bouts.push(dedans + (dedans > 1 ? ' personnes sont dans la salle' : ' personne est dans la salle'));
    if(DATES.length) bouts.push(DATES.length + (DATES.length > 1 ? ' dates à venir' : ' date à venir'));
    if(!bouts.length) bouts.push(messages.length + (messages.length > 1 ? ' messages dans le fil' : ' message dans le fil'));
    titre = bouts.join(', ');
    titre = titre.charAt(0).toUpperCase() + titre.slice(1);
    chapeau = "Un fil pour les questions et les retours, une salle pour se parler. "
            + "La région et le profil, à gauche, filtrent ce que vous voyez sans rien cloisonner.";
  }

  var h = '<div class="chapeau"><div class="sur-titre">Votre point du jour</div>'
    + '<h1>' + ech(titre) + '</h1><p>' + ech(chapeau) + '</p>'
    + '<p class="cadrage">Vous regardez : <b>' + ech(cadreCourant()) + '</b></p></div>';

  h += '<section><div class="titre-section"><h2>La salle</h2><span class="note">toujours ouverte</span></div>'
     + carteSalle() + '</section>';

  h += '<section><div class="titre-section"><h2>Sans réponse</h2></div>';
  if(!attentes.length){
    h += '<div class="vide"><h3>Aucune question en attente</h3>'
       + '<p>Les questions posées dans le fil apparaissent ici tant que personne n’y a répondu, avec le temps écoulé.</p>'
       + '<button class="b" data-vue="echanges">Poser la première question</button></div>';
  } else {
    h += attentes.slice(0, 3).map(function(m){
      return '<div class="mot" style="padding-top:0">' + ligneMot(m) + '</div>';
    }).join('');
  }
  h += '</section>';

  h += '<section><div class="titre-section"><h2>Prochaine session</h2></div>';
  h += DATES.length ? ligneDate(DATES[0])
    : '<div class="vide"><h3>Aucune date posée</h3>'
      + '<p>Les rendez-vous du groupe s’affichent ici, avec le nombre d’inscrits. Les visios se tiennent dans la salle.</p>'
      + '<button class="b creux" data-vue="dates">Voir les dates</button></div>';
  h += '</section>' + pied();
  return h;
}

function carteSalle(){
  var dedans = DANS_LA_SALLE.slice();
  if(VOIX.dedans) dedans.push(MOI.id);
  if(!dedans.length){
    return '<div class="salle"><span class="onde dort"><i></i><i></i><i></i><i></i><i></i></span>'
      + '<div><div class="qui">La salle est vide</div>'
      + '<div class="sous">Votre micro sera bien capté ; la transmission entre participants reste à brancher.</div></div>'
      + '<button class="b" data-voix="entrer">Ouvrir la salle</button></div>';
  }
  var noms = dedans.map(function(id){ return id === MOI.id ? 'vous' : qui(id).nom.split(' ')[0]; });
  var phrase = noms.length === 1 ? noms[0] + (noms[0] === 'vous' ? ' y êtes' : ' y est')
    : noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1] + ' y sont';
  return '<div class="salle active"><span class="onde vit"><i></i><i></i><i></i><i></i><i></i></span>'
    + '<div><div class="qui">' + ech(phrase) + '</div>'
    + '<div class="sous">Micro ouvert sur cet appareil. Personne d’autre ne peut encore vous entendre.</div></div>'
    + '<button class="b creux" data-voix="sortir">Quitter</button></div>';
}

/* ===================================================== échanges */
function vueEchanges(){
  var liste = filtre(FIL).slice().sort(function(a, b){ return b.t - a.t; });

  var h = '<div class="chapeau"><div class="sur-titre">Le fil</div>'
    + '<h1>Une seule liste, pour tout le monde</h1>'
    + '<p>Pas de salon à choisir avant d’écrire. Vous posez votre question, elle reste visible tant qu’elle n’a pas de réponse.</p>'
    + '<p class="cadrage">Vous écrivez dans : <b>' + ech(cadreCourant()) + '</b></p></div>';

  h += '<div class="ecrire"><div class="choix">'
    + '<button class="b petit' + (ET.type === 'question' ? '' : ' creux') + '" data-type="question">Poser une question</button>'
    + '<button class="b petit' + (ET.type === 'partage' ? '' : ' creux') + '" data-type="partage">Partager un retour</button></div>'
    + '<textarea id="brouillon" placeholder="' + (ET.type === 'question'
        ? 'Votre question, avec ce que vous avez déjà essayé…'
        : 'Ce que vous avez fait, ce que ça a donné, ce qui coince encore…') + '">' + ech(ET.brouillon) + '</textarea>'
    + '<div class="bas"><span class="conseil">' + (ET.type === 'question'
        ? 'Donnez le contexte et le résultat attendu : c’est ce qui fait venir les réponses.'
        : 'Un chiffre avant / après vaut mieux qu’un avis.') + '</span>'
    + '<button class="b" id="publier"' + (ET.brouillon.trim().length < 3 ? ' disabled' : '') + '>Publier</button></div></div>';

  if(ET.region !== 'toutes' || ET.profil !== 'tous'){
    h += '<div class="actifs"><span>Filtres :</span>'
      + (ET.region !== 'toutes' ? '<span class="jeton">' + ech(R[ET.region].nom) + '<button data-region="toutes" aria-label="Retirer le filtre de région">×</button></span>' : '')
      + (ET.profil !== 'tous' ? '<span class="jeton">' + ech(P[ET.profil].nom) + '<button data-profil="tous" aria-label="Retirer le filtre de profil">×</button></span>' : '')
      + '</div>';
  }

  if(!liste.length){
    h += '<div class="vide" style="margin-top:24px">'
      + (FIL.length
          ? '<h3>Rien dans ce périmètre</h3><p>Aucun message pour ' + ech(cadreCourant().toLowerCase()) + '. Élargissez avec « Toutes les régions ».</p>'
            + '<button class="b creux" data-region="toutes">Voir tout le réseau</button>'
          : '<h3>Le fil est vide</h3><p>Aucun message pour l’instant. Le champ ci-dessus attend le premier.</p>'
            + '<div class="mini">Une question qui dit le contexte, ce qui a été essayé et le résultat attendu reçoit une réponse le jour même. Une question en une ligne reste sans réponse.</div>')
      + '</div>';
  } else {
    h += '<div style="margin-top:8px">' + liste.map(function(m){
      return '<article class="mot">' + ligneMot(m) + '</article>';
    }).join('') + '</div>';
  }
  return h + pied();
}

function ligneMot(m){
  var p = qui(m.qui);
  var question = m.type === 'question';
  var resolue = question && m.rep.length;
  var utile = !!ET.utiles[m.id];
  var etiq = question
    ? (resolue ? '<span class="etiq ok">Répondu</span>' : '<span class="etiq q">En attente</span>')
    : '<span class="etiq part">Retour</span>';

  var h = '<div class="tete">' + past(m.qui)
    + '<div><div class="nom">' + ech(p.nom) + '</div>'
    + '<div class="ident">' + ech(p.metier) + (p.region && R[p.region] ? ' · ' + ech(R[p.region].nom) : '') + '</div></div>'
    + '<span class="quand">' + etiq + '<br>' + depuis(m.t) + '</span></div>';

  h += '<p class="corps' + (question ? ' serif' : '') + '">' + ech(m.txt) + '</p>';

  h += '<div class="actions">'
    + '<button class="lien" data-repondre="' + m.id + '">Répondre</button>'
    + '<button class="lien" data-utile="' + m.id + '"' + (utile ? ' style="color:var(--pousse)"' : '') + '>'
    + (utile ? 'Noté comme utile' : 'Utile') + (m.nbUtiles ? ' · ' + m.nbUtiles : '') + '</button></div>';

  if(m.rep.length){
    h += '<div class="reponses">' + m.rep.map(function(r){
      return '<div class="rep">' + past(r.qui, 'pt')
        + '<div><span class="nom">' + ech(qui(r.qui).nom) + '</span> '
        + '<span class="quand">' + depuis(r.t) + '</span>'
        + '<p class="corps">' + ech(r.txt) + '</p></div></div>';
    }).join('') + '</div>';
  }

  if(ET.repond === m.id){
    h += '<div class="repondre"><textarea id="reponse" placeholder="Votre réponse à '
      + ech(p.nom.split(' ')[0]) + '…"></textarea>'
      + '<div class="bas"><button class="b petit" data-envoyer="' + m.id + '">Envoyer</button>'
      + '<button class="lien" data-annuler="1">Annuler</button></div></div>';
  }
  return h;
}

/* ===================================================== ressources */
function vueRessources(){
  var q = ET.cherche.toLowerCase();
  var liste = RESSOURCES.filter(function(r){
    return !q || (r.t + ' ' + r.sert).toLowerCase().indexOf(q) > -1;
  });
  var h = '<div class="chapeau"><div class="sur-titre">Ce que le groupe fabrique</div>'
    + '<h1>Ressources</h1>'
    + '<p>Chaque fichier déposé dit sur quel cas réel il a servi, et ce qu’il ne couvre pas. Sans ça on ne le réutilise pas : on le refait.</p></div>';

  if(RESSOURCES.length){
    h += '<div class="cherche">' + loupe()
      + '<input id="cherche" type="search" placeholder="Chercher…" value="' + ech(ET.cherche) + '"></div>';
  }
  h += liste.length ? liste.map(ligneRessource).join('')
    : '<div class="vide"><h3>Aucune ressource déposée</h3>'
      + '<p>Une trame, une grille de relecture, un tableur : ce qui a déjà servi une fois à quelqu’un du groupe.</p>'
      + '<div class="mini">Le dépôt de fichiers demande un espace de stockage — c’est l’une des briques à brancher.</div></div>';
  return h + pied();
}

function ligneRessource(r){
  return '<div class="res"><span class="type">' + ech(r.type) + '</span>'
    + '<div><h3>' + ech(r.t) + '</h3><div class="par">' + ech(qui(r.qui).nom) + '</div></div>'
    + '<button class="b creux petit">Prendre</button></div>';
}

/* ===================================================== dates */
function vueDates(){
  var h = '<div class="chapeau"><div class="sur-titre">Les rendez-vous</div>'
    + '<h1>Dates</h1>'
    + '<p>Les visios se tiennent dans la salle, la même que celle de l’accueil : aucun lien à retrouver, rien à installer.</p></div>';
  h += DATES.length ? DATES.map(ligneDate).join('')
    : '<div class="vide"><h3>Aucune date au calendrier</h3>'
      + '<p>Sessions, ateliers en région, restitutions de promo : les rendez-vous apparaîtront ici, avec le nombre d’inscrits et les places restantes.</p></div>';
  return h + pied();
}

function ligneDate(d){
  var date = new Date(d.iso + 'T00:00:00');
  return '<div class="date-l"><div class="cal"><div class="j">' + date.getDate() + '</div>'
    + '<div class="m">' + date.toLocaleDateString('fr-FR', {month:'short'}).replace('.','') + '</div></div>'
    + '<div><h3>' + ech(d.t) + '</h3><div class="ou">' + ech(d.ou) + '</div></div>'
    + '<div class="cta"><button class="b petit">Je viens</button></div></div>';
}

function majBandeau(){
  var b = document.getElementById('bandeau');
  var t = document.getElementById('bandeau-texte');
  if(!b || !t) return;
  if(EN_LIGNE){ b.hidden = true; return; }
  b.hidden = false;
  t.innerHTML = '<b>Maquette</b><span>Ce que vous écrivez reste dans cet onglet : rien n’est envoyé, '
    + 'partagé, ni conservé après un rechargement. La base de données n’est pas encore branchée.</span>';
}

function pied(){
  if(EN_LIGNE && SESSION.etat === 'pret'){
    return '<p class="pied">Connecté comme ' + ech(MOI.nom) + '. Les messages sont partagés avec le groupe '
      + 'et arrivent en direct. <button class="lien" data-acces="sortir">Se déconnecter</button></p>';
  }
  return '<p class="pied">Espace vierge : aucun membre, aucun message, aucune ressource. '
    + 'La structure — régions, profils, salle — attend d’être reliée à une base de données partagée.</p>';
}
function loupe(){
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--encre-3);flex:none" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>';
}
function icone(n){
  var d = {
    micro:'<path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
    coupe:'<path d="M9 9v3a3 3 0 0 0 4.5 2.6"/><path d="M15 11V6a3 3 0 0 0-5.9-.7"/><path d="M5 11a7 7 0 0 0 10.9 5.8"/><path d="M12 18v3"/><path d="M4 4l16 16"/>',
    ecran:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>',
    sortir:'<path d="M6 6l12 12"/><path d="M18 6L6 18"/>'
  };
  return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d[n] + '</svg>';
}

/* ===================================================== barre flottante */
function rendreDock(){
  var dock = document.getElementById('dock');
  if(!VOIX.dedans){ dock.innerHTML = ''; return; }
  var etat = VOIX.micro === 'ok' ? (VOIX.coupe ? 'micro coupé' : 'micro ouvert')
           : (VOIX.micro === 'refuse' ? 'le navigateur a refusé le micro' : 'autorisation du micro…');
  var barres = '';
  for(var i = 0; i < 7; i++) barres += '<i></i>';
  dock.innerHTML = '<span class="vu' + (VOIX.coupe ? ' coupe' : '') + '" id="vu" aria-hidden="true">' + barres + '</span>'
    + '<div><div class="titre">La salle · vous seul</div>'
    + '<div class="sous">' + ech(etat) + (VOIX.micro === 'ok' ? ' · barre d’espace pour parler' : '') + '</div></div>'
    + '<div class="outils">'
    + '<button class="o" data-voix="micro" aria-pressed="' + VOIX.coupe + '" aria-label="'
    + (VOIX.coupe ? 'Rouvrir le micro' : 'Couper le micro') + '">' + icone(VOIX.coupe ? 'coupe' : 'micro') + '</button>'
    + '<button class="o" data-voix="ecran" aria-pressed="' + (!!VOIX.ecran) + '" aria-label="Partager l’écran">' + icone('ecran') + '</button>'
    + '<button class="o sortir" data-voix="sortir" aria-label="Quitter la salle">' + icone('sortir') + '</button></div>';
}

function majVu(){
  var vu = document.getElementById('vu');
  if(!vu) return;
  var b = vu.children, n = b.length;
  for(var i = 0; i < n; i++){
    var centre = 1 - Math.abs(i - (n - 1) / 2) / n;
    b[i].style.height = Math.min(22, 3 + (VOIX.niveau / 100) * 19 * (0.55 + centre)).toFixed(1) + 'px';
  }
}

/* ===================================================== audio */
function boucle(){
  if(!VOIX.analyseur) return;
  VOIX.analyseur.getByteTimeDomainData(VOIX.tampon);
  var s = 0;
  for(var i = 0; i < VOIX.tampon.length; i++){ var v = (VOIX.tampon[i] - 128) / 128; s += v * v; }
  VOIX.niveau = VOIX.coupe ? 0 : Math.min(100, Math.round(Math.sqrt(s / VOIX.tampon.length) * 330));
  majVu();
  VOIX.raf = requestAnimationFrame(boucle);
}
function entrer(){
  if(VOIX.dedans) return;
  VOIX.dedans = true; VOIX.coupe = false; VOIX.micro = 'attente';
  rendre();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ VOIX.micro = 'refuse'; rendre(); return; }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}).then(function(flux){
    VOIX.flux = flux; VOIX.micro = 'ok';
    var AC = window.AudioContext || window.webkitAudioContext;
    VOIX.ctx = new AC();
    var src = VOIX.ctx.createMediaStreamSource(flux);
    VOIX.analyseur = VOIX.ctx.createAnalyser();
    VOIX.analyseur.fftSize = 512;
    VOIX.tampon = new Uint8Array(VOIX.analyseur.fftSize);
    src.connect(VOIX.analyseur);
    rendre();
    VOIX.raf = requestAnimationFrame(boucle);
  }).catch(function(){ VOIX.micro = 'refuse'; rendre(); });
}
function sortir(){
  if(VOIX.raf) cancelAnimationFrame(VOIX.raf);
  if(VOIX.flux) VOIX.flux.getTracks().forEach(function(t){ t.stop(); });
  if(VOIX.ecran) VOIX.ecran.getTracks().forEach(function(t){ t.stop(); });
  if(VOIX.ctx && VOIX.ctx.close){ try{ VOIX.ctx.close(); }catch(e){} }
  VOIX.raf = 0; VOIX.flux = null; VOIX.ecran = null; VOIX.ctx = null; VOIX.analyseur = null;
  VOIX.dedans = false; VOIX.coupe = false; VOIX.micro = 'aucun'; VOIX.niveau = 0;
  rendre();
}
function couper(f){
  VOIX.coupe = (typeof f === 'boolean') ? f : !VOIX.coupe;
  if(VOIX.flux) VOIX.flux.getAudioTracks().forEach(function(t){ t.enabled = !VOIX.coupe; });
  if(VOIX.coupe){ VOIX.niveau = 0; }
  rendreDock(); majVu();
}
function partager(){
  if(VOIX.ecran){ VOIX.ecran.getTracks().forEach(function(t){ t.stop(); }); VOIX.ecran = null; rendre(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
  navigator.mediaDevices.getDisplayMedia({video:true, audio:false}).then(function(flux){
    VOIX.ecran = flux;
    flux.getVideoTracks()[0].addEventListener('ended', function(){ VOIX.ecran = null; rendre(); });
    ET.vue = 'aujourdhui';
    rendre();
  }).catch(function(){});
}

/* ===================================================== écrans d'accès */
function vueAcces(){
  var h = '<div class="acces">';
  if(SESSION.etat === 'chargement'){
    h += '<h1>Un instant…</h1><p>Ouverture de votre espace.</p>';
  } else if(SESSION.etat === 'connexion'){
    h += '<div class="sur-titre">Le Maillage</div>'
      + '<h1>Entrer dans l’espace du groupe</h1>'
      + '<p>Indiquez l’adresse avec laquelle vous avez été invité. Vous recevrez un lien de connexion : '
      + 'aucun mot de passe à retenir, rien à installer.</p>'
      + '<form id="form-connexion" class="form-acces">'
      + '<input id="email" type="email" required autocomplete="email" placeholder="vous@exemple.fr" value="' + ech(SESSION.email) + '">'
      + '<button class="b" type="submit"' + (SESSION.occupe ? ' disabled' : '') + '>'
      + (SESSION.occupe ? 'Envoi…' : 'Recevoir le lien') + '</button></form>';
  } else if(SESSION.etat === 'envoye'){
    h += '<div class="sur-titre">Courrier parti</div>'
      + '<h1>Regardez votre boîte</h1>'
      + '<p>Un lien de connexion vient d’être envoyé à <b>' + ech(SESSION.email) + '</b>. '
      + 'Il ouvre directement votre espace. Pensez au dossier des indésirables.</p>'
      + '<button class="b creux" data-acces="retour">Utiliser une autre adresse</button>';
  } else if(SESSION.etat === 'non-membre'){
    h += '<div class="sur-titre">Accès réservé</div>'
      + '<h1>Cette adresse n’est pas encore invitée</h1>'
      + '<p>Vous êtes bien connecté avec <b>' + ech(SESSION.email) + '</b>, mais elle ne figure pas dans la '
      + 'liste du groupe. Demandez à l’animation de vous ajouter, puis reconnectez-vous.</p>'
      + '<button class="b creux" data-acces="sortir">Se déconnecter</button>';
  }
  if(SESSION.message) h += '<p class="alerte">' + ech(SESSION.message) + '</p>';
  return h + '</div>';
}

/* ===================================================== rendu */
function rendre(){
  majBandeau();
  if(EN_LIGNE && SESSION.etat !== 'pret'){
    document.getElementById('menu').innerHTML = '';
    document.getElementById('page').innerHTML = vueAcces();
    document.getElementById('dock').innerHTML = '';
    var saisie = document.getElementById('email');
    if(saisie && document.activeElement !== saisie) saisie.focus();
    return;
  }
  rendreMenu();
  var p = document.getElementById('page');
  if(ET.vue === 'aujourdhui') p.innerHTML = vueAujourdhui();
  else if(ET.vue === 'echanges') p.innerHTML = vueEchanges();
  else if(ET.vue === 'ressources') p.innerHTML = vueRessources();
  else p.innerHTML = vueDates();

  if(VOIX.ecran && ET.vue === 'aujourdhui'){
    var salle = p.querySelector('.salle');
    if(salle){
      var boite = document.createElement('div');
      boite.className = 'ecran';
      boite.innerHTML = '<span class="lg">Votre écran, en direct</span><video autoplay playsinline muted></video>';
      salle.parentNode.insertBefore(boite, salle.nextSibling);
      boite.querySelector('video').srcObject = VOIX.ecran;
    }
  }
  rendreDock(); majVu();
  var r = document.getElementById('reponse');
  if(r) r.focus();
}

/* ===================================================== interactions */
document.getElementById('burger').addEventListener('click', function(){
  ET.menuOuvert = !ET.menuOuvert;
  rendreMenu();
});

document.addEventListener('click', function(e){
  if(e.target.id === 'publier'){
    var txt = ET.brouillon.trim();
    if(txt.length < 3) return;
    ET.brouillon = '';
    e.target.disabled = true;
    Promise.resolve(publierMot(txt, ET.type)).then(rendre);
    return;
  }

  var el = e.target.closest('[data-vue],[data-region],[data-profil],[data-type],[data-repondre],[data-utile],[data-envoyer],[data-annuler],[data-voix],[data-menu],[data-acces]');
  if(!el) return;

  if(el.dataset.acces === 'sortir'){ seDeconnecter(); return; }
  if(el.dataset.acces === 'retour'){ SESSION.etat = 'connexion'; SESSION.message = ''; rendre(); return; }
  if(el.dataset.menu === 'fermer'){ ET.menuOuvert = false; rendreMenu(); return; }
  if(el.dataset.vue){
    ET.vue = el.dataset.vue; ET.repond = null; ET.menuOuvert = false;
    window.scrollTo({top:0, behavior:'smooth'});
    rendre(); return;
  }
  if(el.dataset.region){ ET.region = el.dataset.region; ET.menuOuvert = false; rendre(); return; }
  if(el.dataset.profil){ ET.profil = el.dataset.profil; ET.menuOuvert = false; rendre(); return; }
  if(el.dataset.type){ ET.type = el.dataset.type; rendre(); return; }
  if(el.dataset.repondre){
    ET.vue = 'echanges'; ET.repond = el.dataset.repondre;
    rendre();
    var champ = document.getElementById('reponse');
    if(champ) champ.closest('.mot').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(el.dataset.utile){
    Promise.resolve(basculerUtile(el.dataset.utile)).then(rendre);
    rendre(); return;
  }
  if(el.dataset.envoyer){
    var zone = document.getElementById('reponse');
    var texteRep = zone ? zone.value.trim() : '';
    if(texteRep.length < 2) return;
    ET.repond = null;
    Promise.resolve(publierReponse(el.dataset.envoyer, texteRep)).then(rendre);
    return;
  }
  if(el.dataset.annuler){ ET.repond = null; rendre(); return; }
  if(el.dataset.voix === 'entrer'){ entrer(); return; }
  if(el.dataset.voix === 'sortir'){ sortir(); return; }
  if(el.dataset.voix === 'micro'){ couper(); return; }
  if(el.dataset.voix === 'ecran'){ partager(); return; }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'brouillon'){
    ET.brouillon = e.target.value;
    var b = document.getElementById('publier');
    if(b) b.disabled = ET.brouillon.trim().length < 3;
  }
  if(e.target.id === 'cherche'){
    var pos = e.target.selectionStart;
    ET.cherche = e.target.value;
    rendre();
    var c = document.getElementById('cherche');
    if(c){ c.focus(); try{ c.setSelectionRange(pos, pos); }catch(err){} }
  }
});

document.addEventListener('keydown', function(e){
  var champ = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key === 'Escape' && ET.menuOuvert){ ET.menuOuvert = false; rendreMenu(); return; }
  if(e.code === 'Space' && !champ && VOIX.dedans && VOIX.micro === 'ok'){
    e.preventDefault();
    if(!VOIX.ptt){ VOIX.ptt = true; VOIX.pttTemp = VOIX.coupe; couper(!VOIX.coupe); }
  }
});
document.addEventListener('keyup', function(e){
  if(e.code === 'Space' && VOIX.ptt){ VOIX.ptt = false; couper(VOIX.pttTemp); }
});

document.addEventListener('submit', function(e){
  if(e.target.id !== 'form-connexion') return;
  e.preventDefault();
  var saisie = document.getElementById('email');
  var email = saisie ? saisie.value.trim() : '';
  if(email.indexOf('@') < 1) return;
  envoyerLien(email);
});

document.getElementById('jour').textContent =
  new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

if(EN_LIGNE) initialiser(); else rendre();
})();
</script>
